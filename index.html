<title>My Raver Life — EDC Vegas 2026</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e1018;
    --surface: #181a28;
    --surface-2: #21243a;
    --border: #2d3050;
    --text: #f5f3ee;
    --muted: #8a8ca8;
    --accent: #ff2e8a;
    --accent-2: #00d4ff;
    --warn: #ffd166;
    --kineticFIELD: #ff5aa0;
    --circuitGROUNDS: #2cc8ff;
    --neonGARDEN: #5cff3a;
    --cosmicMEADOW: #d39bff;
    --bassPOD: #2dd4c0;
    --wasteLAND: #ff5560;
    --quantumVALLEY: #8b8dff;
    --stereoBLOOM: #ff95dd;
    --bionicJUNGLE: #a3e635;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--text);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    font-size: 16.5px;
    line-height: 1.5;
    letter-spacing: -0.005em;
    -webkit-font-smoothing: antialiased;
  }
  body {
    min-height: 100vh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  header {
    padding: 18px 16px 12px;
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0;
    background: var(--bg);
    z-index: 10;
  }
  h1 {
    margin: 0 0 4px;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.02em;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .sub {
    color: var(--text);
    opacity: 0.75;
    font-size: 14.5px;
    font-weight: 500;
    margin-bottom: 16px;
    letter-spacing: 0.1px;
  }
  .year-tag {
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    font-weight: 800;
    letter-spacing: 0.5px;
  }
  .row {
    display: flex; gap: 8px; align-items: center;
    flex-wrap: wrap;
  }
  .nights {
    display: flex; gap: 6px;
  }
  .night-btn, .mode-btn {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 9px 16px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s ease;
    font-family: inherit;
  }
  .night-btn.active {
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    border-color: transparent;
    color: white;
    font-weight: 600;
  }
  .help-btn {
    margin-left: auto;
    background: var(--surface);
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 9px 16px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .help-btn:hover { color: var(--text); border-color: var(--paper-dim, var(--muted)); }

  .mode-toggle {
    margin-left: auto;
    display: flex; gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px;
  }
  .mode-btn {
    border: none;
    background: transparent;
    padding: 6px 14px;
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
  }
  .mode-btn.active {
    background: var(--surface-2);
    color: var(--text);
  }
  main {
    padding: 16px;
    max-width: 720px;
    margin: 0 auto;
  }
  .bucket {
    margin-bottom: 18px;
  }
  .bucket-header {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 8px;
    padding: 0 4px;
  }
  .bucket-name {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.4px;
    color: var(--text);
  }
  .bucket-time {
    font-size: 12.5px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    font-weight: 500;
  }
  .picks {
    display: flex; flex-direction: column; gap: 6px;
  }
  .pick {
    display: flex; align-items: center; gap: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-left-width: 3px;
    border-radius: 8px;
    padding: 10px 12px;
    transition: background 0.15s ease;
    cursor: pointer;
  }
  .pick:hover { background: var(--surface-2); }
  .pick-artist {
    flex: 1;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .pick-stage {
    font-size: 12px;
    color: var(--text);
    font-weight: 600;
    opacity: 0.85;
    white-space: nowrap;
  }
  .pick-stage .stage-part { font-weight: 700; }
  .pick-stage .sep { opacity: 0.4; margin: 0 4px; }
  .pick-stage .time-part { font-weight: 500; opacity: 0.75; font-variant-numeric: tabular-nums; }
  .pick-del {
    background: none; border: none;
    color: var(--muted); cursor: pointer;
    padding: 4px 6px; font-size: 16px;
    line-height: 1;
    border-radius: 4px;
  }
  .pick-del:hover { color: var(--accent); background: rgba(255,122,89,0.12); }
  .empty {
    color: var(--muted);
    font-size: 13px;
    padding: 12px 4px;
    font-style: italic;
  }
  .conflict {
    color: var(--warn);
    font-size: 11px;
    margin-top: 4px;
    padding: 0 4px;
  }
  .welcome-banner {
    background: linear-gradient(135deg, rgba(255,46,138,0.12), rgba(0,212,255,0.10));
    border: 1px solid rgba(255,46,138,0.25);
    padding: 14px 36px 14px 14px;
    border-radius: 12px;
    margin-bottom: 16px;
    font-size: 13.5px;
    line-height: 1.5;
    color: var(--text);
    position: relative;
  }
  .welcome-banner b { color: var(--accent); }
  .welcome-banner-close {
    position: absolute;
    top: 6px; right: 8px;
    background: none; border: none;
    color: var(--muted);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    padding: 4px 8px;
    font-family: inherit;
  }
  .welcome-banner-close:hover { color: var(--text); }

  /* tab nav */
  nav.tabs {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    display: flex;
    justify-content: center;
    gap: 4px;
    background: rgba(14, 16, 24, 0.78);
    backdrop-filter: blur(16px) saturate(160%);
    -webkit-backdrop-filter: blur(16px) saturate(160%);
    border-top: 1px solid rgba(255,255,255,0.06);
    padding: 8px 16px calc(8px + env(safe-area-inset-bottom));
    z-index: 15;
  }
  .tab {
    background: none; border: none;
    color: var(--muted);
    padding: 9px 22px;
    font-size: 13.5px;
    letter-spacing: 0.6px;
    font-family: inherit;
    font-weight: 600;
    cursor: pointer;
    border-radius: 999px;
    transition: color 180ms ease, background 180ms ease;
  }
  .tab.active {
    color: var(--text);
    background: rgba(255, 46, 138, 0.12);
  }
  .tab .ico { display: none; }

  /* stages view */
  .stage-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left-width: 4px;
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 10px;
  }
  .stage-card h3 { margin: 0 0 4px; font-size: 15px; }
  .stage-card .genre { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
  .stage-card .desc { font-size: 13px; line-height: 1.5; color: var(--text); opacity: 0.9; }

  /* Map view — official illustrated map.png with invisible tap hotspots
     overlaid at each main stage. Hotspots only become visible on hover/tap. */
  .map-wrap {
    padding: 4px 0 16px;
    max-width: 480px;
    margin: 0 auto;
  }
  .map-note {
    font-size: 11.5px;
    color: var(--muted);
    line-height: 1.45;
    margin: 10px 4px 0;
    text-align: center;
    opacity: 0.75;
  }
  .map-note a {
    color: inherit;
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .map-img-container {
    position: relative;
    line-height: 0;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--border);
    touch-action: none;          /* JS owns pinch + pan gestures */
    -webkit-user-select: none;
    user-select: none;
  }
  /* Centered "you're not at the venue" message — overlay above the map.
     Cute, elegant, reassures user that GPS is working and they'll see
     their pin once they arrive. */
  .map-far-msg {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(14, 16, 24, 0.88);
    color: #fff;
    padding: 14px 20px;
    border-radius: 14px;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.2px;
    text-align: center;
    line-height: 1.4;
    max-width: 84%;
    backdrop-filter: blur(10px) saturate(140%);
    -webkit-backdrop-filter: blur(10px) saturate(140%);
    border: 1px solid rgba(255, 90, 160, 0.35);
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.4);
    z-index: 20;
    pointer-events: none;
  }
  .map-far-msg .map-far-sub {
    display: inline-block;
    margin-top: 6px;
    font-size: 11.5px;
    font-weight: 500;
    color: var(--muted);
    letter-spacing: 0.1px;
  }
  .map-img {
    width: 100%;
    height: auto;
    display: block;
  }
  /* Stage marker — clean colored dot, name lives only in the popover. */
  .map-hotspot {
    position: absolute;
    width: 18px;
    height: 18px;
    margin-left: -9px;
    margin-top: -9px;
    border-radius: 50%;
    background: currentColor;
    border: 2px solid #fff;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.45), 0 1px 4px rgba(0,0,0,0.5);
    cursor: pointer;
    padding: 0;
    font-family: inherit;
    transition: transform 0.18s ease, box-shadow 0.18s ease;
    -webkit-tap-highlight-color: transparent;
    z-index: 2;
  }
  .map-hotspot:hover,
  .map-hotspot:focus-visible {
    transform: scale(1.3);
    outline: none;
    z-index: 3;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.45), 0 0 0 3px rgba(255,255,255,0.22), 0 0 10px currentColor;
  }
  .map-hotspot.selected {
    transform: scale(1.5);
    z-index: 4;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.45), 0 0 0 4px rgba(255,255,255,0.28), 0 0 14px currentColor;
  }
  .map-hint {
    margin: 12px 4px 0;
    text-align: center;
    color: var(--muted);
    font-size: 12.5px;
    font-style: italic;
  }

  /* GPS "you are here" pin — pulsing cyan dot with directional cone above.
     Counter-scaled in JS so it stays the same on-screen size at any zoom. */
  .user-pin {
    position: absolute;
    width: 18px;
    height: 18px;
    margin-left: -9px;
    margin-top: -9px;
    pointer-events: none;
    z-index: 6;
    transform-origin: center center;
    transition: transform 0.05s linear;
  }
  .user-pin-dot {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: var(--accent-2);
    border: 3px solid #fff;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.5), 0 0 12px var(--accent-2);
  }
  .user-pin-pulse {
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    background: var(--accent-2);
    opacity: 0.4;
    animation: userPinPulse 2.2s ease-out infinite;
    pointer-events: none;
  }
  @keyframes userPinPulse {
    0%   { transform: scale(0.6); opacity: 0.55; }
    100% { transform: scale(2.4); opacity: 0; }
  }
  /* Directional cone — anchored at the dot center, extends "up" by default,
     rotated to phone heading. Uses conic-gradient for the beam shape. */
  .user-pin-cone {
    position: absolute;
    inset: -16px;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background:
      conic-gradient(
        from 330deg,
        transparent 0deg,
        rgba(0, 212, 255, 0.55) 18deg,
        rgba(0, 212, 255, 0.05) 30deg,
        transparent 30deg
      );
    transform-origin: center center;
    pointer-events: none;
    transition: transform 0.12s linear;
  }

  /* Map status line (GPS errors, etc.) */
  .map-status {
    display: none;
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(14, 16, 24, 0.92);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 12px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 7;
    white-space: nowrap;
  }

  /* Zoom controls — top-right of the map */
  .map-zoom-controls {
    position: absolute;
    top: 8px;
    right: 8px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    z-index: 4;
  }
  .map-zoom-btn {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: rgba(14, 16, 24, 0.85);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 16px;
    font-weight: 700;
    line-height: 1;
    cursor: pointer;
    font-family: inherit;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    -webkit-tap-highlight-color: transparent;
  }
  .map-zoom-btn:active { background: var(--accent); border-color: var(--accent); }

  .map-zoom-target {
    transform-origin: center center;
    transition: transform 0.05s linear;
    will-change: transform;
  }

  .lineup-view {
    padding: 0 18px;
    max-width: 480px;
    margin: 0 auto;
  }
  /* Lineup's sticky bar must clear the page header (which is also sticky
     at top:0). --header-h is measured at runtime since header height
     varies between viewports. */
  .lineup-view .lineup-sticky {
    position: sticky;
    top: var(--header-h, 0px);
    z-index: 5;
    padding: 12px 0 10px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }
  .lineup-view .artist-results {
    max-height: none;
    border-radius: 8px;
    display: block;
    border: 1px solid var(--border);
  }

  .modal-bg {
    position: fixed; inset: 0;
    background: rgba(0, 0, 0, 0.7);
    display: none;
    align-items: flex-end; justify-content: center;
    z-index: 30;
    backdrop-filter: blur(4px);
  }
  .modal-bg.open { display: flex; }
  .modal {
    background: var(--surface);
    border-top-left-radius: 18px;
    border-top-right-radius: 18px;
    padding: 20px 18px calc(20px + env(safe-area-inset-bottom));
    width: 100%;
    max-width: 480px;
    border-top: 1px solid var(--border);
  }
  @media (min-width: 600px) {
    .modal-bg { align-items: center; }
    .modal { border-radius: 18px; }
  }
  .modal { position: relative; }
  .modal h2 {
    margin: 0 0 14px;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.01em;
    padding-right: 28px;
  }
  .modal-close {
    position: absolute;
    top: 14px; right: 14px;
    background: none;
    border: none;
    color: var(--muted);
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
    padding: 4px 8px;
    font-family: inherit;
    font-weight: 300;
    border-radius: 50%;
  }
  .modal-close:hover { color: var(--text); background: var(--surface-2); }
  .field { margin-bottom: 12px; }
  .field label {
    display: block;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--muted);
    margin-bottom: 6px;
    font-weight: 600;
  }
  .field input, .field select {
    width: 100%;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 16px;        /* 16px+ prevents iOS auto-zoom on focus */
    font-family: inherit;
  }
  .input-wrap { position: relative; }
  .input-wrap input { padding-right: 32px; }
  .input-clear {
    position: absolute;
    right: 4px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--muted);
    font-size: 20px;
    font-weight: 300;
    line-height: 1;
    cursor: pointer;
    padding: 6px 10px;
    font-family: inherit;
    display: none;
  }
  .input-clear.show { display: block; }
  .input-clear:hover { color: var(--text); }
  .input-clear:active { color: var(--accent); }
  .field input:focus, .field select:focus {
    outline: none;
    border-color: var(--accent-2);
  }

  /* ── Lineup search bar — pill, real icon, focus glow ───────────── */
  .search-bar {
    position: relative;
    margin-top: 10px;
  }
  .search-bar input {
    width: 100%;
    box-sizing: border-box;
    background: var(--surface-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 12px 44px 12px 44px;
    font-size: 16px;       /* 16px+ prevents iOS auto-zoom */
    font-family: inherit;
    line-height: 1.2;
    transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    -webkit-appearance: none;
    appearance: none;
  }
  .search-bar input::placeholder {
    color: var(--muted);
    opacity: 0.7;
  }
  .search-bar input:focus {
    outline: none;
    border-color: var(--accent);
    background: var(--bg);
    box-shadow: 0 0 0 4px rgba(255, 46, 138, 0.18);
  }
  .search-bar .search-ico {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    pointer-events: none;
    display: flex;
    transition: color 0.15s ease;
  }
  .search-bar input:focus + .search-ico,
  .search-bar input:focus ~ .search-ico { color: var(--accent); }
  .search-bar .input-clear {
    right: 6px;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    padding: 0;
    display: none;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    background: var(--surface);
    font-size: 18px;
  }
  .search-bar .input-clear.show { display: flex; }
  .search-bar .input-clear:hover { color: var(--text); background: var(--border); }
  /* day chips */
  .day-chips {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
  }

  /* Lineup toolbar: 🔴 Now (filter) on the left + Sort toggle (A-Z / Stages) on the right.
     The #timeBuckets element is reused as the toolbar container. */
  .time-buckets {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 8px;
  }
  .tool-spacer { flex: 1 1 auto; }
  .tool-btn {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 12px;
    border-radius: 999px;
    font-family: inherit;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.2px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    line-height: 1;
    -webkit-tap-highlight-color: transparent;
    transition: all 0.15s ease;
  }
  .tool-btn.now-chip { gap: 5px; }
  /* ON: solid red fill so the toggle state reads at a glance — no extra glow. */
  .tool-btn.now-chip.active {
    background: #ff3b3b;
    border-color: #ff3b3b;
    color: #fff;
  }
  .tool-btn.now-chip.active .now-dot {
    background: #fff;
    box-shadow: 0 0 4px rgba(255, 255, 255, 0.6);
  }
  .now-dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #ff3b3b;
    animation: nowPulse 1.5s ease-in-out infinite;
    flex-shrink: 0;
    box-shadow: 0 0 4px #ff3b3b;
  }
  @keyframes nowPulse {
    0%, 100% { opacity: 0.45; transform: scale(1); }
    50%      { opacity: 1;    transform: scale(1.35); }
  }
  /* Sort toggle — segmented control (Name / Stage) */
  .sort-toggle {
    display: inline-flex;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 2px;
    gap: 0;
  }
  .sort-btn {
    background: transparent;
    border: none;
    color: var(--muted);
    padding: 4px 12px;
    border-radius: 999px;
    font-family: inherit;
    font-size: 11.5px;
    font-weight: 700;
    cursor: pointer;
    line-height: 1;
    -webkit-tap-highlight-color: transparent;
    transition: all 0.15s ease;
  }
  .sort-btn.active {
    background: var(--surface-2);
    color: var(--text);
  }

  /* Stage section header (when sorted by Stage) — also a tap target that
     fills the search bar with the stage id, narrowing the list to that stage. */
  .lineup-stage-header {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 12px 12px 6px;
    background: var(--bg);
    border: none;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    text-align: left;
    font-family: inherit;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.15s ease;

  .lineup-stage-header:first-child { padding-top: 6px; }
  .lineup-stage-header:hover, .lineup-stage-header:active {
    background: var(--surface);
  }
  .lsh-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .lsh-name {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    flex: 1;
  }
  .lsh-tap {
    font-size: 10.5px;
    font-weight: 600;
    color: var(--text);
    background: var(--surface-2);
    padding: 2px 9px;
    border-radius: 999px;
    border: 1px solid var(--border);
    letter-spacing: 0.2px;
    text-transform: none;
    opacity: 0.95;
  }

  /* day chip — stacked label */
  .day-chip {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 5px 5px;
    border-radius: 8px;
    font-family: inherit;
    font-size: 11.5px;
    cursor: pointer;
    transition: all 0.15s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    line-height: 1;
    box-sizing: border-box;
  }
  .day-chip .name {
    display: block;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.2px;
    line-height: 1.05;
    margin: 0;
    width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    text-align: center;
    flex: 0 0 auto;
  }
  .day-chip .sub {
    display: block;
    font-size: 9px;
    opacity: 0.55;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    line-height: 1.05;
    margin: 0;
    width: 100%;
    text-align: center;
    text-transform: lowercase;
    letter-spacing: 0.2px;
    color: var(--muted);

  .day-chip.active {
    border-color: var(--accent);

  .day-chip.active .sub {
    opacity: 0.85;
    color: var(--accent);

  /* Artist list — flows full-height; the page is the scroll container. */
  .artist-results {
    margin-top: 8px;
    border: 1px solid var(--border);
    border-radius: 10px;

  .artist-results.show { display: block; }
  .artist-result {
    padding: 7px 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 9px;
    border-bottom: 1px solid var(--border);
    font-size: 13.5px;
    line-height: 1.25;
  }
  .artist-result:last-child { border-bottom: none; }
  .artist-result:hover, .artist-result.active {
    background: var(--surface-2);
  }
  .artist-result .avatar {
    width: 36px;
    height: 36px;

  .artist-result .name {

  .artist-result a.name:active { opacity: 0.7; }

  .artist-result .stage-tag {

  .artist-result .heart {

  .artist-result .heart:hover { color: var(--accent); }

  .artist-result .stage-tag .day-part { opacity: 0.6; font-weight: 500; }
  .artist-result .stage-tag .time-part { opacity: 0.85; font-weight: 600; font-variant-numeric: tabular-nums; }
  .artist-result .stage-tag .sep { opacity: 0.4; margin: 0 4px; }
  /* Stage chip — read-only colored label (dot + name) on each artist row.
     Secondary stages (art cars, pop-ups) get reduced opacity so the 9 main
     stages naturally read as the headliner venues at first glance. */
  .artist-result .stage-tag .stage-part {

  .artist-result .stage-tag .stage-part::before {

  /* Timeline grid view */
  .timeline {

  }

    position: absolute;

  .timeline-block {

  .timeline-block .b-del {

  /* Live "NOW" marker — solid accent-color hairline + matching pill,

  .timeline-now {

  /* Help page — full content sections */

  .help-list {

  .connect-intro {

  .plur-tag {

  /* Global footer — appears at the end of every page's content. The
     padding-bottom clears the fixed bottom nav so the credit lines aren't
     hidden behind it when scrolled to the end. */
  .app-footer {
    padding: 24px 18px calc(72px + env(safe-area-inset-bottom));

  .offline-status {

  .help-credit {

<body>

<header>
  <h1 id="appTitle">My Raver Life</h1>
  <div class="sub" id="appSub">EDC Las Vegas <span class="year-tag">2026</span> · May 15–17</div>
  <div class="row" id="planControls">
    <div class="nights">
      <button class="night-btn active" data-night="1">Fri</button>
      <button class="night-btn" data-night="2">Sat</button>
      <button class="night-btn" data-night="3">Sun</button>
    </div>
  </div>
</header>

<main id="main"></main>

<div id="lineupView" class="lineup-view" style="display:none">
  <div class="lineup-sticky">
    <div class="day-chips" id="dayChips"></div>
    <div class="search-bar">
      <input id="artistInput" type="text" placeholder="search artist or stage…" autocomplete="off" enterkeyhint="search" />
      <span class="search-ico" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </span>
      <button type="button" id="clearArtistBtn" class="input-clear" aria-label="Clear">×</button>
    </div>
    <div class="time-buckets" id="timeBuckets"></div>
  </div>
  <div class="artist-results" id="artistResults"></div>
</div>

<footer class="app-footer">
  <div id="offlineStatus" class="offline-status" aria-live="polite"></div>
  <div class="byline">
    made with PLUR by <a class="ig-text" href="https://www.instagram.com/thequguy" target="_blank" rel="noopener">@thequguy</a>  ·  say hi at EDC ✌
  </div>
  <p class="copyright-bottom">Unofficial fan-made schedule. Not affiliated with Insomniac or EDC. All trademarks belong to their owners. © 2026 Hung Pham · v157</p>
</footer>

<nav class="tabs">
  <button class="tab active" data-tab="lineup">Lineup</button>
  <button class="tab" data-tab="plan">My Schedule</button>
  <button class="tab" data-tab="map">Map</button>
  <button class="tab" data-tab="help">Help</button>
</nav>

<script>
  // Festival-specific data is loaded from festival.config.js (window.FESTIVAL).
  // The rest of this script is festival-agnostic.
  const STAGES = window.FESTIVAL.stages;
  const BUCKETS = window.FESTIVAL.buckets;

  // Inject festival branding into the static header (HTML allowed in subtitle).
  document.getElementById('appTitle').textContent = window.FESTIVAL.appName;
  document.getElementById('appSub').innerHTML = window.FESTIVAL.subtitle;

  // Flat lineup: each entry { name, day, stage }. Loaded from assets/artists.json.
  let ARTISTS = [];
  function loadArtists() {
    return fetch('assets/artists.json')
      .then(r => r.ok ? r.json() : [])
      .then(data => { ARTISTS = Array.isArray(data) ? data : []; })
      .catch(() => { ARTISTS = []; });
  }
  // Returns existing pick.id if user has hearted this artist (same name+day+stage), else null.
  function findPickIdForArtist(a) {
    const list = state.picks[a.day] || [];
    const target = a.name.toLowerCase();
    const hit = list.find(p =>
      p.artist.toLowerCase() === target && p.stage === a.stage
    );
    return hit ? hit.id : null;
  }

  // Heart toggle: add the artist as a pick (with their real lineup time) or remove if already there.
  function toggleHeartArtist(a) {
    const existing = findPickIdForArtist(a);
    if (existing) {
      deletePick(existing);
      return;
    }
    const startMins = timeStrToMins(a.start);
    const endMins = timeStrToMins(a.end);

  // ── MAP CALIBRATION (2-anchor precise) ─────────────────────────────────
  // Two verified-precise points anchor the entire GPS ↔ map transform:
  //   1. Downtown EDC (central plaza, small footprint, easy to pinpoint).
  //   2. Gate C/D (permanent LVMS entrance gate, west side of property).
  //      Distance + direction from anchor 1 locks scale + orientation.
  //
  // Both GPS values were verified directly from Google Maps (right-click
  // → coordinates), not estimated from satellite eyeballing. Two precise
  // anchors beats four fuzzy ones because the math is an EXACT fit
  // through both points — no least-squares averaging.
  //
  // Why these two specifically:
  //   • Downtown EDC is Insomniac's branded central plaza, placed at
  //     the natural geometric center of the LVMS infield. The same
  //     spot every year.
  //   • Gate C/D is permanent LVMS infrastructure (the road entrance
  //     building on the west side). Won't move in 2026 or any future
  //     year — concrete, lit, surveyed.
  //
  // The math: two independent 1-D linear fits (top%↔lat, left%↔lng).
  // Handles non-uniform stretching (Insomniac's portrait map squishes
  // the wide-but-short LVMS oval into a tall rectangle). Assumes the
  // map is approximately north-up — confirmed visually on the 2025 map
  // (Gate C/D shows upper-left of Downtown EDC, matching its real NW
  // position).
  //
  // YEARLY UPDATE WHEN A NEW MAP DROPS:
  //   • GPS values: do NOT change. Both points are at the same physical
  //     spot every year (Downtown EDC plaza + concrete LVMS gate).
  //   • mapPct values: re-eyeball where each anchor lands on the new
  //     image and update.
  const SPEEDWAY_ANCHORS = [
    { name: 'Downtown EDC', mapPct: { left: 36.46, top: 54.37 }, gps: { lat: 36.272914,          lng: -115.011007          } },
    { name: 'Gate C/D',     mapPct: { left:  9.30, top: 53.64 }, gps: { lat: 36.27498535179921,  lng: -115.01313780128011  } },
    { name: 'Oval Top',     mapPct: { left: 41.84, top:  9.46 }, gps: { lat: 36.27481793053691,  lng: -115.00627038603729  } },
    { name: 'Oval Bottom',  mapPct: { left: 42.07, top: 96.56 }, gps: { lat: 36.269574134943305, lng: -115.01424058659038  } },
    { name: 'Oval East',    mapPct: { left: 73.07, top: 54.26 }, gps: { lat: 36.27065185384524,  lng: -115.00866203499909  } },
  ];

  // Festival map's pixel dimensions. Only used by the 2-anchor similarity
  // fallback to convert mapPct → isotropic pixels (so rotation is
  // well-defined). The ≥3-anchor affine path doesn't need them — it works
  // on (lat, lng) and (left%, top%) directly.
  const MAP_IMG_W = 1080;
  const MAP_IMG_H = 1350;

  // Convert real-world GPS to local meters (east, north) relative to a ref.
  function gpsToLocalMeters(lat, lng, refLat, refLng) {
    const M_PER_DEG_LAT = 111320;
    const M_PER_DEG_LNG = 111320 * Math.cos(refLat * Math.PI / 180);
    return {
      east:  (lng - refLng) * M_PER_DEG_LNG,
      north: (lat - refLat) * M_PER_DEG_LAT,
    };
  }

  // ── Math helpers ────────────────────────────────────────────────────────
  // Solve a 3×3 linear system M·β = b via Cramer's rule. Used by the
  // affine least-squares fitter below.
  function solve3x3(M, b) {
    const det = (m) =>
      m[0][0] * (m[1][1] * m[2][2] - m[1][2] * m[2][1]) -
      m[0][1] * (m[1][0] * m[2][2] - m[1][2] * m[2][0]) +
      m[0][2] * (m[1][0] * m[2][1] - m[1][1] * m[2][0]);
    const D = det(M);
    const M0 = [[b[0], M[0][1], M[0][2]], [b[1], M[1][1], M[1][2]], [b[2], M[2][1], M[2][2]]];
    const M1 = [[M[0][0], b[0], M[0][2]], [M[1][0], b[1], M[1][2]], [M[2][0], b[2], M[2][2]]];
    const M2 = [[M[0][0], M[0][1], b[0]], [M[1][0], M[1][1], b[1]], [M[2][0], M[2][1], b[2]]];
    return [det(M0) / D, det(M1) / D, det(M2) / D];
  }

  // Least-squares fit y = β₀·x₁ + β₁·x₂ + β₂. Solved via the normal
  // equations Xᵀ·X·β = Xᵀ·y, where X = [x₁, x₂, 1].
  function fitLinear3(x1s, x2s, ys) {
    let s11 = 0, s12 = 0, s1 = 0, s22 = 0, s2 = 0;
    let sy1 = 0, sy2 = 0, sy = 0;
    const n = x1s.length;
    for (let i = 0; i < n; i++) {
      const a = x1s[i], b = x2s[i], y = ys[i];
      s11 += a * a; s12 += a * b; s1 += a;
      s22 += b * b; s2 += b;
      sy1 += a * y; sy2 += b * y; sy += y;
    }
    return solve3x3([[s11, s12, s1], [s12, s22, s2], [s1, s2, n]], [sy1, sy2, sy]);
  }

  // ── 2-anchor similarity transform (rotation + uniform scale + translation)
  // Used when SPEEDWAY_ANCHORS has exactly 2 entries. Exact fit at both
  // anchors, but assumes uniform scale — won't capture map non-uniform
  // stretching (which Insomniac's portrait artwork has). Adding a 3rd
  // anchor switches us to affine least-squares (see below) which does.
  // Math via complex multiplication:
  //   z_pixel = factor * w_meters + offset
  //   factor = (a + b·i) encodes scale + rotation
  //   w_meters = east + (-north)·i  (screen-y-down convention)
  function fitSimilarity(anchors) {
    const A = anchors[0], B = anchors[1];
    const refLat = A.gps.lat, refLng = A.gps.lng;
    const zAx = A.mapPct.left / 100 * MAP_IMG_W;
    const zAy = A.mapPct.top  / 100 * MAP_IMG_H;
    const zBx = B.mapPct.left / 100 * MAP_IMG_W;
    const zBy = B.mapPct.top  / 100 * MAP_IMG_H;
    const mB = gpsToLocalMeters(B.gps.lat, B.gps.lng, refLat, refLng);
    const wRe = mB.east, wIm = -mB.north;
    const dzRe = zBx - zAx, dzIm = zBy - zAy;
    const denom = wRe * wRe + wIm * wIm;
    const fRe = (dzRe * wRe + dzIm * wIm) / denom;
    const fIm = (dzIm * wRe - dzRe * wIm) / denom;
    return {
      kind: 'similarity',
      transform(lat, lng) {
        const m = gpsToLocalMeters(lat, lng, refLat, refLng);
        const wr = m.east, wi = -m.north;
        const zx = fRe * wr - fIm * wi + zAx;
        const zy = fRe * wi + fIm * wr + zAy;
        return { left: zx / MAP_IMG_W * 100, top: zy / MAP_IMG_H * 100 };
      },
      // Compass: convert real-world heading (0=N, 90=E, cw) to the cone's
      // CSS rotate value (cw from screen-up). Accounts for the map's
      // rotation so the cone points where the user actually faces ON THE
      // MAP, not where it'd face on a north-up map.
      headingToScreenAngle(heading) {
        const H = heading * Math.PI / 180;
        const e = Math.sin(H), n = Math.cos(H);
        const sx = fRe * e + fIm * n;
        const sy = fIm * e - fRe * n;
        return Math.atan2(sx, -sy) * 180 / Math.PI;
      },
    };
