<!-- F.1: Firebase modular SDK loader (ESM, no eval, CSP-safe).
     Just exposes window.fb and fires 'firebase-ready'. Nothing
     consumes it yet — findfriend.js is untouched. -->
<script type="module">
import { initializeApp } from './vendor/firebase/firebase-app.js';
import { getAuth, signInAnonymously, onAuthStateChanged } from './vendor/firebase/firebase-auth.js';
import { getDatabase, ref, set, onValue, off, remove, onDisconnect, runTransaction, serverTimestamp } from './vendor/firebase/firebase-database.js';
window.fb = {
  initializeApp,
  getAuth, signInAnonymously, onAuthStateChanged,
  getDatabase, ref, set, onValue, off, remove, onDisconnect, runTransaction, serverTimestamp,
};
console.log('[fb] module loaded');
window.dispatchEvent(new Event('firebase-ready'));
</script>

<style>
  :root {
    --bg: #0e1018;
    --surface: #181a28;
    --surface-2: #21243a;
    --border: #2d3050;
    --text: #f5f3ee;
    --muted: #8a8ca8;
    --accent: #ff2e8a;
    --accent-2: #00d4ff;
    --warn: #ffd166;
    --kineticFIELD: #ff5aa0;
    --circuitGROUNDS: #2cc8ff;
    --neonGARDEN: #5cff3a;
    --cosmicMEADOW: #d39bff;
    --bassPOD: #2dd4c0;
    --wasteLAND: #ff5560;
    --quantumVALLEY: #8b8dff;
    --stereoBLOOM: #ff95dd;
    --bionicJUNGLE: #a3e635;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--text);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    font-size: 16.5px;
    line-height: 1.5;
    letter-spacing: -0.005em;
    -webkit-font-smoothing: antialiased;
  }
  body {
    min-height: 100vh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  header {
    padding: 18px 16px 12px;
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0;
    background: var(--bg);
    z-index: 10;
  }
  h1 {
    margin: 0 0 4px;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.02em;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .sub {
    color: var(--text);
    opacity: 0.75;
    font-size: 14.5px;
    font-weight: 500;
    margin-bottom: 16px;
    letter-spacing: 0.1px;
  }
  .year-tag {
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    font-weight: 800;
    letter-spacing: 0.5px;
  }
  .row {
    display: flex; gap: 8px; align-items: center;
    flex-wrap: wrap;
  }
  .nights {
    display: flex; gap: 6px;
  }
  .night-btn, .mode-btn {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 9px 16px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s ease;
    font-family: inherit;
  }
  .night-btn.active {
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    border-color: transparent;
    color: white;
    font-weight: 600;
  }
  .help-btn {
    margin-left: auto;
    background: var(--surface);
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 9px 16px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .help-btn:hover { color: var(--text); border-color: var(--paper-dim, var(--muted)); }

  .mode-toggle {
    margin-left: auto;
    display: flex; gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px;
  }
  .mode-btn {
    border: none;
    background: transparent;
    padding: 6px 14px;
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
  }
  .mode-btn.active {
    background: var(--surface-2);
    color: var(--text);
  }
  main {
    padding: 16px;
    max-width: 720px;
    margin: 0 auto;
  }
  .bucket {
    margin-bottom: 18px;
  }
  .bucket-header {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 8px;
    padding: 0 4px;
  }
  .bucket-name {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.4px;
    color: var(--text);
  }
  .bucket-time {
    font-size: 12.5px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    font-weight: 500;
  }
  .picks {
    display: flex; flex-direction: column; gap: 6px;
  }
  .pick {
    display: flex; align-items: center; gap: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-left-width: 3px;
    border-radius: 8px;
    padding: 10px 12px;
    transition: background 0.15s ease;
    cursor: pointer;
  }
  .pick:hover { background: var(--surface-2); }
  .pick-artist {
    flex: 1;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .pick-stage {
    font-size: 12px;
    color: var(--text);
    font-weight: 600;
    opacity: 0.85;
    white-space: nowrap;
  }
  .pick-stage .stage-part { font-weight: 700; }
  .pick-stage .sep { opacity: 0.4; margin: 0 4px; }
  .pick-stage .time-part { font-weight: 500; opacity: 0.75; font-variant-numeric: tabular-nums; }
  .pick-del {
    background: none; border: none;
    color: var(--muted); cursor: pointer;
    padding: 4px 6px; font-size: 16px;
    line-height: 1;
    border-radius: 4px;
  }
  .pick-del:hover { color: var(--accent); background: rgba(255,122,89,0.12); }
  .empty {
    color: var(--muted);
    font-size: 13px;
    padding: 12px 4px;
    font-style: italic;
  }
  .conflict {
    color: var(--warn);
    font-size: 11px;
    margin-top: 4px;
    padding: 0 4px;
  }
  .welcome-banner {
    background: linear-gradient(135deg, rgba(255,46,138,0.12), rgba(0,212,255,0.10));
    border: 1px solid rgba(255,46,138,0.25);
    padding: 14px 36px 14px 14px;
    border-radius: 12px;
    margin-bottom: 16px;
    font-size: 13.5px;
    line-height: 1.5;
    color: var(--text);
    position: relative;
  }
  .welcome-banner b { color: var(--accent); }
  .welcome-banner-close {
    position: absolute;
    top: 6px; right: 8px;
    background: none; border: none;
    color: var(--muted);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    padding: 4px 8px;
    font-family: inherit;
  }
  .welcome-banner-close:hover { color: var(--text); }

  /* tab nav */
  nav.tabs {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    display: flex;
    justify-content: stretch;
    gap: 2px;
    background: rgba(14, 16, 24, 0.78);
    backdrop-filter: blur(16px) saturate(160%);
    -webkit-backdrop-filter: blur(16px) saturate(160%);
    border-top: 1px solid rgba(255,255,255,0.06);
    padding: 8px 6px calc(8px + env(safe-area-inset-bottom));
    z-index: 15;
  }
  .tab {
    flex: 1;
    background: none; border: none;
    color: var(--muted);
    padding: 9px 4px;
    font-size: 12.5px;
    letter-spacing: 0.3px;
    font-family: inherit;
    font-weight: 600;
    cursor: pointer;
    border-radius: 999px;
    transition: color 180ms ease, background 180ms ease;
    text-align: center;
    white-space: nowrap;
  }
  .tab.active {
    color: var(--text);
    background: rgba(255, 46, 138, 0.12);
  }
  .tab .ico { display: none; }

  /* stages view */
  .stage-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left-width: 4px;
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 10px;
  }
  .stage-card h3 { margin: 0 0 4px; font-size: 15px; }
  .stage-card .genre { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
  .stage-card .desc { font-size: 13px; line-height: 1.5; color: var(--text); opacity: 0.9; }

  /* Map view — official illustrated map.png with invisible tap hotspots
     overlaid at each main stage. Hotspots only become visible on hover/tap. */
  .map-wrap {
    padding: 4px 0 16px;
    max-width: 480px;
    margin: 0 auto;
  }
  .map-note {
    font-size: 11.5px;
    color: var(--muted);
    line-height: 1.45;
    margin: 10px 4px 0;
    text-align: center;
    opacity: 0.75;
  }
  .map-note a {
    color: inherit;
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .map-img-container {
    position: relative;
    line-height: 0;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--border);
    touch-action: none;          /* JS owns pinch + pan gestures */
    -webkit-user-select: none;
    user-select: none;
  }
  /* Centered "you're not at the venue" message — overlay above the map.
     Cute, elegant, reassures user that GPS is working and they'll see
     their pin once they arrive. */
  /* Far-from-Speedway pill — matches friend-sheet style: bottom of map
     area, dark glass, slide-up, auto-dismiss. Short and simple. */
  .map-far-msg {
    position: absolute;
    left: 50%;
    bottom: 12px;
    transform: translateX(-50%);
    background: rgba(14, 16, 24, 0.94);
    backdrop-filter: blur(14px) saturate(160%);
    -webkit-backdrop-filter: blur(14px) saturate(160%);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    padding: 10px 16px;
    font-size: 12.5px;
    font-weight: 600;
    color: #fff;
    text-align: center;
    line-height: 1.3;
    max-width: calc(100% - 24px);
    box-shadow: 0 6px 22px rgba(0,0,0,0.42);
    z-index: 30;
    pointer-events: none;
    animation: friendSheetIn 0.18s cubic-bezier(0.2, 0.8, 0.4, 1);
  }
  .map-img {
    width: 100%;
    height: auto;
    display: block;
  }
  /* Stage marker — clean colored dot, name lives only in the popover. */
  .map-hotspot {
    position: absolute;
    width: 18px;
    height: 18px;
    margin-left: -9px;
    margin-top: -9px;
    border-radius: 50%;
    background: currentColor;
    border: 2px solid #fff;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.45), 0 1px 4px rgba(0,0,0,0.5);
    cursor: pointer;
    padding: 0;
    font-family: inherit;
    transition: transform 0.18s ease, box-shadow 0.18s ease;
    -webkit-tap-highlight-color: transparent;
    z-index: 2;
  }
  .map-hotspot:hover,
  .map-hotspot:focus-visible {
    transform: scale(1.3);
    outline: none;
    z-index: 3;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.45), 0 0 0 3px rgba(255,255,255,0.22), 0 0 10px currentColor;
  }
  .map-hotspot.selected {
    transform: scale(1.5);
    z-index: 4;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.45), 0 0 0 4px rgba(255,255,255,0.28), 0 0 14px currentColor;
  }
  .map-hint {
    margin: 12px 4px 0;
    text-align: center;
    color: var(--muted);
    font-size: 12.5px;
    font-style: italic;
  }

  /* GPS "you are here" pin — pulsing cyan dot with directional cone above.
     Counter-scaled in JS so it stays the same on-screen size at any zoom. */
  .user-pin {
    position: absolute;
    width: 26px;
    height: 26px;
    margin-left: -13px;
    margin-top: -13px;
    pointer-events: none;
    z-index: 6;
    transform-origin: center center;
    transition: transform 0.05s linear;
    /* Counter-scale on map zoom: --pin-scale is set on .map-zoom-target.
       0.9× baseline makes the dot sit visually quieter on the map. */
    transform: scale(calc(var(--pin-scale, 1) * 0.9));
  }
  .user-pin-dot {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: var(--user-color, var(--accent-2));
    border: 3px solid #fff;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.5), 0 0 12px var(--user-color, var(--accent-2));
  }
  .user-pin-pulse {
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    background: var(--user-color, var(--accent-2));
    opacity: 0.4;
    animation: userPinPulse 2.2s ease-out infinite;
    pointer-events: none;
  }
  @keyframes userPinPulse {
    0%   { transform: scale(0.6); opacity: 0.55; }
    100% { transform: scale(2.4); opacity: 0; }
  }
  /* F.8: friend pins on the map. Smaller than user pin so the "you are here"
     stays the visual anchor. Each shows its initial inside. Counter-scaled
     on map zoom so the pin stays the same on-screen size at any zoom. */
  .friend-pin {
    position: absolute;
    width: 30px; height: 30px;
    margin-left: -15px; margin-top: -15px;
    border-radius: 50%;
    border: 2px solid #fff;
    z-index: 5;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 800;
    color: #fff;
    letter-spacing: -0.2px;
    text-shadow: 0 1px 1px rgba(0,0,0,0.55);
    box-shadow:
      0 0 0 1px rgba(0,0,0,0.45),
      0 2px 8px rgba(0,0,0,0.5),
      0 0 16px 2px var(--ff-glow, rgba(0,212,255,0.7));
    transition: transform 0.12s ease;
    /* 0.9× baseline keeps friend pins visually quieter against the map.
       --pin-scale is the zoom-compensation multiplier. */
    transform: scale(calc(var(--pin-scale, 1) * 0.9));
  }
  .friend-pin:active { transform: scale(calc(var(--pin-scale, 1) * 0.9 * 0.88)); }
  /* All friend pins gently breathe so they stand out against the
     colorful festival map. Offline pins still breathe, just dimmed. */
  .friend-pin {
    animation: friendPulse 2.5s ease-in-out infinite;
  }
  .friend-pin.offline { opacity: 0.7; }
  @keyframes friendPulse {
    0%, 100% { transform: scale(calc(var(--pin-scale, 1) * 0.9));                  }
    50%      { transform: scale(calc(var(--pin-scale, 1) * 0.9 * 1.15));            }
  }

  /* F.9: bottom sheet on friend-pin tap. Pinned at bottom of map area
     (not viewport) so it sits cleanly inside the map frame. Same content
     style as the Friends tab row: avatar + name + freshness + distance. */
  .friend-sheet {
    position: absolute;
    left: 50%;
    bottom: 12px;
    transform: translateX(-50%);
    background: rgba(14, 16, 24, 0.94);
    backdrop-filter: blur(14px) saturate(160%);
    -webkit-backdrop-filter: blur(14px) saturate(160%);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    padding: 10px 14px;
    display: flex; align-items: center; gap: 11px;
    color: var(--text);
    z-index: 30;
    width: calc(100% - 24px);
    max-width: 380px;
    box-shadow: 0 6px 22px rgba(0,0,0,0.42);
    animation: friendSheetIn 0.18s cubic-bezier(0.2, 0.8, 0.4, 1);
  }
  @keyframes friendSheetIn {
    from { opacity: 0; transform: translate(-50%, 10px); }
    to   { opacity: 1; transform: translate(-50%, 0);   }
  }
  .friend-sheet-init {
    width: 48px; height: 48px;
    border-radius: 50%;
    border: 2.5px solid #fff;
    display: flex; align-items: center; justify-content: center;
    color: white; font-size: 17px; font-weight: 800;
    flex-shrink: 0;
    letter-spacing: -0.3px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  .friend-sheet-meta { flex: 1; min-width: 0; overflow: hidden; }
  .friend-sheet-name {
    font-size: 14.5px; font-weight: 700; line-height: 1.2;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .friend-sheet-sub {
    font-size: 11.5px; color: var(--muted); margin-top: 3px;
    font-variant-numeric: tabular-nums;
    line-height: 1.4;
  }
  .friend-sheet-sub .ff-fresh-bullet {
    margin-right: 5px;
    vertical-align: middle;
    transform: translateY(-1px);
  }
  /* v210: pin variant of friend-sheet — top-aligned for multi-line messages. */
  .friend-sheet-pin { align-items: flex-start; }
  .friend-sheet-pin .friend-sheet-init { margin-top: 2px; }
  .friend-sheet-pin .friend-sheet-meta { overflow: visible; }
  .friend-sheet-pin .friend-sheet-name { white-space: normal; }
  .friend-sheet-pin-msg {
    white-space: normal !important;
    line-height: 1.55 !important;
    color: var(--text) !important;
    font-size: 13.5px !important;
    font-weight: 400;
    font-style: italic;
    letter-spacing: 0.15px;
    margin-top: 6px !important;
    padding-left: 9px;
    border-left: 2px solid rgba(118, 224, 192, 0.4);
    word-wrap: break-word;
    /* Safety net: cap to 4 lines if somehow longer than the 100-char input */
    display: -webkit-box;
    -webkit-line-clamp: 4;
    -webkit-box-orient: vertical;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .friend-sheet-pin-age {
    font-size: 11.5px;
    color: var(--muted);
    margin-top: 6px;
    line-height: 1.4;
    font-variant-numeric: tabular-nums;
  }
  .friend-sheet-remove {
    flex-shrink: 0;
    padding: 6px 10px;
    border-radius: 8px;
    border: 1px solid rgba(255, 126, 181, 0.4);
    background: transparent;
    color: #ff7eb5;
    font-size: 11.5px; font-weight: 600;
    cursor: pointer;
    align-self: center;
  }
  .friend-sheet-remove:hover { border-color: #ff7eb5; }
  .friend-sheet-remove:active { transform: scale(0.96); }
  .friend-sheet-x {
    position: absolute;
    top: 14px; right: 14px;
    width: 24px; height: 24px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.06);
    color: rgba(255,255,255,0.7);
    font-size: 15px; line-height: 1; font-weight: 400;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.12s ease, color 0.12s ease;
  }
  .friend-sheet-x:hover { background: rgba(255,255,255,0.14); color: #fff; }
  .friend-sheet-x:active { transform: scale(0.92); }
  /* Directional cone — anchored at the dot center, extends "up" by default,
     rotated to phone heading. Uses conic-gradient for the beam shape. */
  .user-pin-cone {
    position: absolute;
    inset: -22px;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background:
      conic-gradient(
        from 330deg,
        transparent 0deg,
        rgba(0, 212, 255, 0.85) 30deg,
        transparent 60deg
      );
    transform-origin: center center;
    pointer-events: none;
    transition: transform 0.12s linear;
    /* Subtle white edge for contrast against busy festival artwork. */
    filter: drop-shadow(0 0 2px rgba(0,0,0,0.5));
  }

  /* Map status line (GPS errors, etc.) */
  .map-status {
    display: none;
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(14, 16, 24, 0.92);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 12px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 7;
    white-space: nowrap;
  }

  /* Zoom controls — top-right of the map */
  .map-zoom-controls {
    position: absolute;
    top: 8px;
    right: 8px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    z-index: 4;
  }
  .map-zoom-btn {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: rgba(14, 16, 24, 0.85);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 16px;
    font-weight: 700;
    line-height: 1;
    cursor: pointer;
    font-family: inherit;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    -webkit-tap-highlight-color: transparent;
  }
  .map-zoom-btn:active { background: var(--accent); border-color: var(--accent); }

  /* Compass: classic two-tone needle, top-left of map. Rotated once at
     render to point to true North on the (rotated) festival map. */
  .map-compass {
    position: absolute;
    top: 8px;
    left: 8px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: rgba(14, 16, 24, 0.85);
    border: 1px solid var(--border);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 4;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  .map-compass-needle {
    width: 30px;
    height: 30px;
    display: block;
    transform-origin: 50% 50%;
  }

  /* v210: legend at top of map — mini shapes match the real dot/pin look.
     Shifted off-center to the right to avoid the festival artwork's
     centered title text. Clears the zoom buttons (right:8 + ~32px wide). */
  .map-legend {
    position: absolute;
    top: 10px;
    right: 56px;
    z-index: 5;
    font-size: 11px;
    color: rgba(255, 255, 255, 0.85);
    background: rgba(15, 18, 25, 0.7);
    padding: 5px 12px;
    border-radius: 999px;
    backdrop-filter: blur(10px) saturate(140%);
    -webkit-backdrop-filter: blur(10px) saturate(140%);
    letter-spacing: 0.3px;
    pointer-events: none;
    user-select: none;
    box-shadow: 0 2px 6px rgba(0,0,0,0.25);
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .map-legend .legend-shape {
    display: inline-block;
    margin-right: 3px;
    vertical-align: middle;
  }
  .map-legend .legend-dot {
    width: 11px; height: 11px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ff7eb5, #76e0c0);
    border: 1.5px solid #fff;
    box-shadow: 0 0 0 0.5px rgba(0,0,0,0.4);
  }
  .map-legend .legend-pin-mini {
    width: 10px; height: 10px;
    border-radius: 50% 50% 50% 0;
    background: linear-gradient(135deg, #76e0c0, #ff7eb5);
    border: 1.5px solid #fff;
    box-shadow: 0 0 0 0.5px rgba(0,0,0,0.4);
    transform: rotate(-45deg);
    margin-bottom: 1px;
  }
  .map-legend .legend-sep {
    opacity: 0.5;
    margin: 0 2px;
  }

  /* v210: persistent drop/remove pill at bottom-center. Cute + transparent. */
  /* Button row at the bottom of the map. Holds the personal-pin pill
     and the group-pin pill side by side. Centered as a pair. */
  .map-pinbtn-row {
    position: absolute;
    left: 50%; bottom: 14px;
    transform: translateX(-50%);
    z-index: 6;
    display: flex;
    gap: 8px;
  }
  .map-droppin-btn {
    padding: 6px 13px;
    border-radius: 999px;
    border: 1px solid rgba(118, 224, 192, 0.45);
    background: rgba(14, 16, 24, 0.78);
    color: #76e0c0;
    font-size: 11.5px; font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    backdrop-filter: blur(14px) saturate(160%);
    -webkit-backdrop-filter: blur(14px) saturate(160%);
    box-shadow: 0 2px 8px rgba(0,0,0,0.28);
    transition: transform 0.08s ease, border-color 0.14s ease, background 0.14s ease;
  }
  .map-droppin-btn:hover { background: rgba(20, 24, 34, 0.85); }
  .map-droppin-btn:active { transform: scale(0.96); }
  /* Group-pin — same glass+blur style as personal, but with a warm dark
     amber background and a richer honey-gold accent. The warm-toned
     glass clearly differs from personal's cool slate; the richer gold
     reads as elegant rather than the brighter mustard yellow. */
  .map-droppin-btn.is-group {
    background: rgba(38, 26, 6, 0.82);
    border-color: rgba(244, 202, 100, 0.70);
    color: #f4ca64;
    box-shadow: 0 2px 10px rgba(244, 202, 100, 0.16), 0 2px 8px rgba(0, 0, 0, 0.28);
  }
  .map-droppin-btn.is-group:hover {
    background: rgba(50, 36, 10, 0.88);
    border-color: #f4ca64;
  }

  /* v210: meeting pin = classic teardrop (rotated rounded square). Tip
     touches lat/lng. Universal "marker" shape — clearly different from
     the round breathing friend dots. */
  .meeting-pin {
    position: absolute;
    width: 28px; height: 38px;
    margin-left: -14px; margin-top: -38px; /* tip = bottom-center = lat/lng */
    z-index: 6;
    cursor: pointer;
    pointer-events: auto;
    /* 0.9× of the friend-pin baseline so teardrops sit visually quieter
       on the map. --pin-scale is the zoom-compensation multiplier. */
    transform: scale(calc(var(--pin-scale, 1) * 0.9));
    transform-origin: 50% 100%;
    /* tiny ground shadow under tip */
    filter: drop-shadow(0 3px 4px rgba(0,0,0,0.45));
  }
  .meeting-pin .meeting-pin-shape {
    width: 28px; height: 28px;
    border-radius: 50% 50% 50% 0;
    background: var(--mp-color, #76e0c0);
    border: 2px solid #fff;
    box-shadow:
      0 0 0 1.5px rgba(0,0,0,0.5);
    transform: rotate(-45deg);
    position: relative;
    margin: 5px 0 0 0;
  }
  .meeting-pin .meeting-pin-text {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) rotate(45deg);
    color: #fff;
    font-size: 10.5px; font-weight: 800;
    letter-spacing: -0.2px;
    text-shadow: 0 1px 1px rgba(0,0,0,0.55);
    white-space: nowrap;
  }
  .meeting-pin.dragging {
    transform: scale(calc(var(--pin-scale, 1) * 0.9 * 1.18));
    z-index: 10;
  }
  .meeting-pin.dragging .meeting-pin-shape {
    box-shadow:
      0 0 0 1.5px rgba(0,0,0,0.55),
      0 8px 18px rgba(0,0,0,0.5);
  }
  /* Group pin: same teardrop shape, fixed gold color, slightly larger.
     A ⭐ marker sits on top so it reads as "the group's pin" at a glance. */
  .meeting-pin.is-group {
    width: 32px; height: 44px;
    margin-left: -16px; margin-top: -44px;
    z-index: 7;
  }
  .meeting-pin.is-group .meeting-pin-shape {
    width: 32px; height: 32px;
    /* Solid red. Personal pins use per-name HSL colors at 72% saturation /
       58% lightness; this red is brighter and pure-saturation so it never
       collides with a name-hash color. Classic "red badge + white star". */
    background: #ff3838;
    box-shadow: 0 0 0 1.5px rgba(0,0,0,0.55);
  }
  .meeting-pin.is-group .meeting-pin-text {
    color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,0.4);
    font-size: 18px;
  }
  /* Freshness glow when someone else just updated the group pin.
     Pulses for ~30s or until the user opens the sheet (whichever first). */
  .meeting-pin.is-group.is-fresh .meeting-pin-shape {
    animation: groupPinFresh 1.4s ease-in-out infinite;
  }
  @keyframes groupPinFresh {
    0%, 100% { box-shadow: 0 0 0 1.5px rgba(0,0,0,0.55), 0 0 0 0 rgba(255,56,56,0.55); }
    50%      { box-shadow: 0 0 0 1.5px rgba(0,0,0,0.55), 0 0 0 10px rgba(255,56,56,0); }
  }

  .map-zoom-target {
    transform-origin: center center;
    transition: transform 0.05s linear;
    will-change: transform;
  }

  .lineup-view {
    padding: 0 18px;
    max-width: 480px;
    margin: 0 auto;
  }
  /* Lineup's sticky bar must clear the page header (which is also sticky
     at top:0). --header-h is measured at runtime since header height
     varies between viewports. */
  .lineup-view .lineup-sticky {
    position: sticky;
    top: var(--header-h, 0px);
    z-index: 5;
    padding: 12px 0 10px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }
  .lineup-view .artist-results {
    max-height: none;
    border-radius: 8px;
    display: block;
    border: 1px solid var(--border);
  }

  .modal-bg {
    position: fixed; inset: 0;
    background: rgba(0, 0, 0, 0.7);
    display: none;
    align-items: flex-end; justify-content: center;
    z-index: 30;
    backdrop-filter: blur(4px);
  }
  .modal-bg.open { display: flex; }
  .modal {
    background: var(--surface);
    border-top-left-radius: 18px;
    border-top-right-radius: 18px;
    padding: 20px 18px calc(20px + env(safe-area-inset-bottom));
    width: 100%;
    max-width: 480px;
    border-top: 1px solid var(--border);
  }
  @media (min-width: 600px) {
    .modal-bg { align-items: center; }
    .modal { border-radius: 18px; }
  }
  .modal { position: relative; }
  .modal h2 {
    margin: 0 0 14px;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.01em;
    padding-right: 28px;
  }
  .modal-close {
    position: absolute;
    top: 14px; right: 14px;
    background: none;
    border: none;
    color: var(--muted);
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
    padding: 4px 8px;
    font-family: inherit;
    font-weight: 300;
    border-radius: 50%;
  }
  .modal-close:hover { color: var(--text); background: var(--surface-2); }
  .field { margin-bottom: 12px; }
  .field label {
    display: block;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--muted);
    margin-bottom: 6px;
    font-weight: 600;
  }
  .field input, .field select {
    width: 100%;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 16px;        /* 16px+ prevents iOS auto-zoom on focus */
    font-family: inherit;
  }
  .input-wrap { position: relative; }
  .input-wrap input { padding-right: 32px; }
  .input-clear {
    position: absolute;
    right: 4px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--muted);
    font-size: 20px;
    font-weight: 300;
    line-height: 1;
    cursor: pointer;
    padding: 6px 10px;
    font-family: inherit;
    display: none;
  }
  .input-clear.show { display: block; }
  .input-clear:hover { color: var(--text); }
  .input-clear:active { color: var(--accent); }
  .field input:focus, .field select:focus {
    outline: none;
    border-color: var(--accent-2);
  }

  /* ── Lineup search bar — pill, real icon, focus glow ───────────── */
  .search-bar {
    position: relative;
    margin-top: 10px;
  }
  .search-bar input {
    width: 100%;
    box-sizing: border-box;
    background: var(--surface-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 12px 44px 12px 44px;
    font-size: 16px;       /* 16px+ prevents iOS auto-zoom */
    font-family: inherit;
    line-height: 1.2;
    transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    -webkit-appearance: none;
    appearance: none;
  }
  .search-bar input::placeholder {
    color: var(--muted);
    opacity: 0.7;
  }
  .search-bar input:focus {
    outline: none;
    border-color: var(--accent);
    background: var(--bg);
    box-shadow: 0 0 0 4px rgba(255, 46, 138, 0.18);
  }
  .search-bar .search-ico {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    pointer-events: none;
    display: flex;
    transition: color 0.15s ease;
  }
  .search-bar input:focus + .search-ico,
  .search-bar input:focus ~ .search-ico { color: var(--accent); }
  .search-bar .input-clear {
    right: 6px;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    padding: 0;
    display: none;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    background: var(--surface);
    font-size: 18px;
  }
  .search-bar .input-clear.show { display: flex; }
  .search-bar .input-clear:hover { color: var(--text); background: var(--border); }
  /* day chips */
  .day-chips {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
  }

  /* Lineup toolbar: 🔴 Now (filter) on the left + Sort toggle (A-Z / Stages) on the right.
     The #timeBuckets element is reused as the toolbar container. */
  .time-buckets {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 8px;
  }
  .tool-spacer { flex: 1 1 auto; }
  .tool-btn {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 12px;
    border-radius: 999px;
    font-family: inherit;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.2px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    line-height: 1;
    -webkit-tap-highlight-color: transparent;
    transition: all 0.15s ease;
  }
  .tool-btn.now-chip { gap: 5px; }
  /* ON: solid red fill so the toggle state reads at a glance — no extra glow. */
  .tool-btn.now-chip.active {
    background: #ff3b3b;
    border-color: #ff3b3b;
    color: #fff;
  }
  .tool-btn.now-chip.active .now-dot {
    background: #fff;
    box-shadow: 0 0 4px rgba(255, 255, 255, 0.6);
  }
  .now-dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #ff3b3b;
    animation: nowPulse 1.5s ease-in-out infinite;
    flex-shrink: 0;
    box-shadow: 0 0 4px #ff3b3b;
  }
  @keyframes nowPulse {
    0%, 100% { opacity: 0.45; transform: scale(1); }
    50%      { opacity: 1;    transform: scale(1.35); }
  }
  /* Sort toggle — segmented control (Name / Stage) */
  .sort-toggle {
    display: inline-flex;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 2px;
    gap: 0;
  }
  .sort-btn {
    background: transparent;
    border: none;
    color: var(--muted);
    padding: 4px 12px;
    border-radius: 999px;
    font-family: inherit;
    font-size: 11.5px;
    font-weight: 700;
    cursor: pointer;
    line-height: 1;
    -webkit-tap-highlight-color: transparent;
    transition: all 0.15s ease;
  }
  .sort-btn.active {
    background: var(--surface-2);
    color: var(--text);
  }

  /* Stage section header (when sorted by Stage) — also a tap target that
     fills the search bar with the stage id, narrowing the list to that stage. */
  .lineup-stage-header {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 12px 12px 6px;
    background: var(--bg);
    border: none;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    text-align: left;
    font-family: inherit;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.15s ease;
  }
  .lineup-stage-header:first-child { padding-top: 6px; }
  .lineup-stage-header:hover, .lineup-stage-header:active {
    background: var(--surface);
  }
  .lsh-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .lsh-name {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    flex: 1;
  }
  .lsh-tap {
    font-size: 10.5px;
    font-weight: 600;
    color: var(--text);
    background: var(--surface-2);
    padding: 2px 9px;
    border-radius: 999px;
    border: 1px solid var(--border);
    letter-spacing: 0.2px;
    text-transform: none;
    opacity: 0.95;
  }

  /* day chip — stacked label */
  .day-chip {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 5px 5px;
    border-radius: 8px;
    font-family: inherit;
    font-size: 11.5px;
    cursor: pointer;
    transition: all 0.15s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    line-height: 1;
    box-sizing: border-box;
  }
  .day-chip .name {
    display: block;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.2px;
    line-height: 1.05;
    margin: 0;
    width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    text-align: center;
    flex: 0 0 auto;
  }
  .day-chip .sub {
    display: block;
    font-size: 9px;
    opacity: 0.55;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    line-height: 1.05;
    margin: 0;
    width: 100%;
    text-align: center;
    text-transform: lowercase;
    letter-spacing: 0.2px;
    color: var(--muted);
    flex: 0 0 auto;
  }
  .day-chip.active {
    border-color: var(--accent);
    background: rgba(255, 46, 138, 0.14);
    color: var(--text);
  }
  .day-chip.active .sub {
    opacity: 0.85;
    color: var(--accent);
  }
  /* Artist list — flows full-height; the page is the scroll container. */
  .artist-results {
    margin-top: 8px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--bg);
    display: none;
  }
  .artist-results.show { display: block; }
  .artist-result {
    padding: 7px 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 9px;
    border-bottom: 1px solid var(--border);
    font-size: 13.5px;
    line-height: 1.25;
  }
  .artist-result:last-child { border-bottom: none; }
  .artist-result:hover, .artist-result.active {
    background: var(--surface-2);
  }
  .artist-result .avatar {
    width: 36px;
    height: 36px;
    border-radius: 6px;
    object-fit: cover;
    flex-shrink: 0;
    background: var(--surface-2);
    border: 1px solid var(--border);
  }
  .artist-result .name {
    flex: 1;
    font-weight: 500;
    color: inherit;
    text-decoration: none;
    cursor: pointer;
  }
  .artist-result a.name:active { opacity: 0.7; }
  .artist-result .name mark {
    background: rgba(255,180,84,0.25);
    color: var(--text);
    padding: 0 2px;
    border-radius: 2px;
  }
  .artist-result .stage-tag {
    font-size: 12px;
    color: var(--text);
    font-weight: 600;
    letter-spacing: 0.02em;
    white-space: nowrap;
    opacity: 0.85;
  }
  .artist-result .heart {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    padding: 6px 8px;
    margin-left: 2px;
    margin-right: -4px;
    transition: color 0.15s, transform 0.12s;
    font-family: inherit;
    flex-shrink: 0;
    -webkit-tap-highlight-color: transparent;
  }
  .artist-result .heart:hover { color: var(--accent); }
  .artist-result .heart:active { transform: scale(1.25); }
  .artist-result .heart.on {
    color: var(--accent);
    text-shadow: 0 0 8px rgba(255, 46, 138, 0.5);
  }
  .artist-result .stage-tag .day-part { opacity: 0.6; font-weight: 500; }
  .artist-result .stage-tag .time-part { opacity: 0.85; font-weight: 600; font-variant-numeric: tabular-nums; }
  .artist-result .stage-tag .sep { opacity: 0.4; margin: 0 4px; }
  /* Stage chip — read-only colored label (dot + name) on each artist row.
     Secondary stages (art cars, pop-ups) get reduced opacity so the 9 main
     stages naturally read as the headliner venues at first glance. */
  .artist-result .stage-tag .stage-part {
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .artist-result .stage-tag .stage-part.stage-secondary {
    opacity: 0.55;
    font-weight: 500;
  }
  .artist-result .stage-tag .stage-part::before {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
    box-shadow: 0 0 6px currentColor;
    flex-shrink: 0;
  }

  /* Timeline grid view */
  .timeline {
    position: relative;
    margin: 6px 0;
  }
  .timeline-hour {
    position: absolute;
    left: 0;
    width: 44px;
    text-align: right;
    font-size: 11px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    font-weight: 500;
    padding-right: 8px;
    line-height: 1;
    transform: translateY(-50%);
    opacity: 0.75;
  }
  .timeline-line {
    position: absolute;
    left: 52px;
    right: 0;
    height: 1px;
    background: var(--border);
    opacity: 0.25;
  }
  .timeline-blocks {
    position: absolute;
    left: 52px;
    right: 0;
    top: 0;
    bottom: 0;
  }
  .timeline-block {
    position: absolute;
    background: var(--surface);
    border: 1px solid var(--border);
    border-left-width: 3px;
    border-radius: 4px;
    padding: 0;
    overflow: hidden;
    box-sizing: border-box;
    min-height: 16px;
    display: flex;
    align-items: center;
  }
  .timeline-block .b-img {
    width: 76px;
    height: 76px;
    object-fit: cover;
    object-position: center 28%;
    border-radius: 8px;
    margin: 7px 0 7px 7px;
    flex-shrink: 0;
    background: var(--bg);
  }
  .timeline-block .b-content {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    padding: 7px 22px 7px 12px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 4px;
  }
  .timeline-block .b-artist {
    font-size: 15px;
    font-weight: 600;
    overflow: hidden;
    line-height: 1.15;
    white-space: nowrap;
    text-overflow: ellipsis;
    letter-spacing: -0.01em;
  }
  .timeline-block .b-stageline {

  /* Global footer — appears at the end of every page's content. The

<body>

<header>
  <h1 id="appTitle">My Raver Life</h1>
  <div class="sub" id="appSub">EDC Las Vegas <span class="year-tag">2026</span> · May 15–17</div>
  <div class="row" id="planControls">
    <div class="nights">
      <button class="night-btn active" data-night="1">Fri</button>
      <button class="night-btn" data-night="2">Sat</button>
      <button class="night-btn" data-night="3">Sun</button>
    </div>
  </div>
</header>

<main id="main"></main>

<div id="lineupView" class="lineup-view" style="display:none">
  <div class="lineup-sticky">
    <div class="day-chips" id="dayChips"></div>
    <div class="search-bar">
      <input id="artistInput" type="text" placeholder="search artist or stage…" autocomplete="off" enterkeyhint="search" />
      <span class="search-ico" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </span>
      <button type="button" id="clearArtistBtn" class="input-clear" aria-label="Clear">×</button>
    </div>
    <div class="time-buckets" id="timeBuckets"></div>
  </div>
  <div class="artist-results" id="artistResults"></div>
</div>

<footer class="app-footer">
  <div id="offlineStatus" class="offline-status" aria-live="polite"></div>
  <div class="byline">
    made with PLUR by <a class="ig-text" href="https://www.instagram.com/thequguy" target="_blank" rel="noopener">@thequguy</a>  ·  say hi at EDC ✌
  </div>
  <p class="copyright-bottom">Unofficial fan-made schedule. Not affiliated with Insomniac or EDC. All trademarks belong to their owners. © 2026 Hung Pham · <span id="appVersion"></span></p>
  <script>
    // Reads from version.js (loaded earlier in head). One source of truth
    // shared with sw.js so bumping version updates both.
    if (typeof self !== 'undefined' && self.APP_VERSION) {
      document.getElementById('appVersion').textContent = self.APP_VERSION;
    }
  </script>
</footer>

<nav class="tabs">
  <button class="tab active" data-tab="lineup">Lineup</button>
  <button class="tab" data-tab="plan">Schedule</button>
  <button class="tab" data-tab="friends">Crew</button>
  <button class="tab" data-tab="map">Map</button>
  <button class="tab" data-tab="help">Help</button>
</nav>

<script>
  // Festival-specific data is loaded from festival.config.js (window.FESTIVAL).
  // The rest of this script is festival-agnostic.
  const STAGES = window.FESTIVAL.stages;
  const BUCKETS = window.FESTIVAL.buckets;

  // Inject festival branding into the static header (HTML allowed in subtitle).
  document.getElementById('appTitle').textContent = window.FESTIVAL.appName;
  document.getElementById('appSub').innerHTML = window.FESTIVAL.subtitle;

  // Flat lineup: each entry { name, day, stage }. Loaded from assets/artists.json.
  let ARTISTS = [];
  function loadArtists() {
    return fetch('assets/artists.json')
      .then(r => r.ok ? r.json() : [])
      .then(data => { ARTISTS = Array.isArray(data) ? data : []; })
      .catch(() => { ARTISTS = []; });
  }
  // Returns existing pick.id if user has hearted this artist (same name+day+stage), else null.
  function findPickIdForArtist(a) {
    const list = state.picks[a.day] || [];
    const target = a.name.toLowerCase();
    const hit = list.find(p =>
      p.artist.toLowerCase() === target && p.stage === a.stage
    );
    return hit ? hit.id : null;
  }

  // Heart toggle: add the artist as a pick (with their real lineup time) or remove if already there.
  function toggleHeartArtist(a) {
    const existing = findPickIdForArtist(a);
    if (existing) {
      deletePick(existing);
      return;
    }
    const startMins = timeStrToMins(a.start);
    const endMins = timeStrToMins(a.end);
    const hasTime = startMins != null && endMins != null && endMins > startMins;
    const pick = {
      id: uid(),
      artist: a.name,
      stage: a.stage,
      bucket: hasTime ? bucketFromMinutes(startMins) : 'peak',
      startMins: hasTime ? startMins : null,
      endMins: hasTime ? endMins : null,
      image: a.image || null,
    };
    if (!state.picks[a.day]) state.picks[a.day] = [];
    state.picks[a.day].push(pick);
    save();
    renderArtistResults(artistInput.value);
    render();
  }

  function findStageForArtist(night, artistName) {
    const target = artistName.trim().toLowerCase();
    const hit = ARTISTS.find(a => a.day === night && a.name.toLowerCase() === target);
    return hit ? hit.stage : null;
  }
  function artistsForNight(night, stageId) {
    return ARTISTS
      .filter(a => a.day === night && (!stageId || a.stage === stageId))
      .map(a => a.name);
  }

  const KEY = 'edcplanner-v1';
  const state = Object.assign({
    night: 1,
    mode: 'assumed',
    picks: { 1: [], 2: [], 3: [] },
    tab: 'lineup',
    welcomeDismissed: false,
  }, load() || {});

  function isStandalone() {
    return window.matchMedia('(display-mode: standalone)').matches
      || window.navigator.standalone === true; // iOS
  }
  function isMobile() {
    return /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
  }

  function load() {
    try { return JSON.parse(localStorage.getItem(KEY)); } catch { return null; }
  }
  function save() {
    localStorage.setItem(KEY, JSON.stringify(state));
  }
  function uid() { return Math.random().toString(36).slice(2, 9); }
  function stage(id) { return STAGES.find(s => s.id === id) || STAGES[0]; }

  // Time helpers — minutes counted from festival start (FESTIVAL.dayStartHour).
  const DAY_START_HOUR = window.FESTIVAL.dayStartHour;
  const DAY_END_HOUR_24 = (DAY_START_HOUR + Math.ceil(window.FESTIVAL.dayLengthMins / 60)) % 24;

  function formatMins(m) {
    const h24 = Math.floor((m / 60 + DAY_START_HOUR) % 24);
    const min = m % 60;
    let h12 = h24 % 12;
    if (h12 === 0) h12 = 12;
    const ampm = h24 < 12 ? 'am' : 'pm';
    return `${h12}:${String(min).padStart(2, '0')}${ampm}`;
  }
  // Parse "23:30" / "11:30pm" / "1:00am" → minutes from festival start. null if outside window.
  function timeStrToMins(str) {
    if (!str) return null;
    const s = String(str).trim().toLowerCase();
    let h = null, min = 0;
    let m = s.match(/^(\d{1,2}):(\d{2})$/);
    if (m) { h = parseInt(m[1], 10); min = parseInt(m[2], 10); }
    else {
      m = s.match(/^(\d{1,2})(?::(\d{2}))?\s*(am|pm)$/);
      if (!m) return null;
      h = parseInt(m[1], 10);
      min = m[2] ? parseInt(m[2], 10) : 0;
      if (m[3] === 'pm' && h !== 12) h += 12;
      if (m[3] === 'am' && h === 12) h = 0;
    }
    // Festival window: from DAY_START_HOUR ... wraps around midnight if overnight.
    if (h >= DAY_START_HOUR) return (h - DAY_START_HOUR) * 60 + min;
    if (h < DAY_END_HOUR_24) return (h + (24 - DAY_START_HOUR)) * 60 + min;
    return null;
  }
  // Map a time (mins from festival start) to one of the configured buckets
  // by checking each bucket's [start, end] range. Default: middle bucket.
  function bucketFromMinutes(mins) {
    if (mins == null) return BUCKETS[Math.floor(BUCKETS.length / 2)].id;
    for (const b of BUCKETS) {
      if (mins >= b.range[0] && mins < b.range[1]) return b.id;
    }
    return BUCKETS[BUCKETS.length - 1].id; // past last bucket → final bucket
  }
  const TIME_OPTIONS = (() => {
    const opts = [];
    for (let m = 0; m <= 630; m += 15) opts.push({ mins: m, label: formatMins(m) });
    return opts;
  })();
  function escape(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  // Build a Spotify search URL for an artist. For B2B sets we link to the
  // first artist (e.g. "Heidi Lawden B2B Masha Mar" → "Heidi Lawden"); strip
  // parenthetical suffixes like "(Throwback Set)" / "(Live)".
  function spotifyUrl(name) {
    let q = String(name).split(/\s+b2b\s+/i)[0];
    q = q.replace(/\s*\([^)]*\)\s*$/, '').trim();
    return `https://open.spotify.com/search/${encodeURIComponent(q)}`;
  }


  // Open the combined 3-night schedule PNG in a new tab. Pre-generated
  // offline by assets/_regen_schedules.js, bundled in APP_SHELL — works at
  // the festival without signal. Long-press to share/save from there.
  function openSchedulePng() {
    window.open('./assets/schedule-all.png', '_blank', 'noopener');
  }

  // ── Avatar sprite map ──────────────────────────────────────────────────
  // 144×144 cells in a 21×20 grid (3024×2880 px), one cell per unique
  // avatar. Bundled in APP_SHELL so atomic install = 100% offline reliable.
  // Used by both Lineup (36px display) and My Schedule (76px display).
  // The 144px source is 4× retina at 36 and 2× retina at 76 — sharp on phones.
  let _avatarCoords = null; // { cols, cell, idx: { url: cellIndex } }
  async function loadAvatarCoords() {
    if (_avatarCoords) return _avatarCoords;
    try {
      _avatarCoords = await (await fetch('./assets/avatars-coords.json')).json();
    } catch (e) { _avatarCoords = null; }
    return _avatarCoords;
  }
  // Returns inline style for background-image + size + position, or '' if
  // the URL isn't in the sprite (falls back to original <img src=url>).
  function avatarSpriteStyleFor(url, displaySize) {
    if (!url || !_avatarCoords) return '';
    const idx = _avatarCoords.idx[url];
    if (idx == null) return '';
    const cell = _avatarCoords.cell;
    const cols = _avatarCoords.cols;
    const totalRows = Math.ceil(Object.keys(_avatarCoords.idx).length / cols);
    const row = Math.floor(idx / cols);
    const col = idx % cols;
    const scale = displaySize / cell;
    const bgW = cell * cols * scale;
    const bgH = cell * totalRows * scale;
    return `background-image:url('./assets/avatars-sprite.jpg');background-repeat:no-repeat;background-size:${bgW.toFixed(1)}px ${bgH.toFixed(1)}px;background-position:-${(col * displaySize).toFixed(1)}px -${(row * displaySize).toFixed(1)}px`;
  }

  const main = document.getElementById('main');
  const planControls = document.getElementById('planControls');
  const lineupView = document.getElementById('lineupView');
  const pageHeader = document.querySelector('header');

  // Measure header height so the lineup-sticky bar sticks just below it.
  function syncHeaderHeightVar() {
    const h = pageHeader ? pageHeader.getBoundingClientRect().height : 0;
    document.documentElement.style.setProperty('--header-h', h + 'px');
  }
  window.addEventListener('resize', syncHeaderHeightVar);
  window.addEventListener('load', syncHeaderHeightVar);

  function render() {
    document.querySelectorAll('.tab').forEach(b => {
      b.classList.toggle('active', b.dataset.tab === state.tab);
    });

    // Lineup tab: hide planControls (night-btn row) but keep page header.
    if (state.tab === 'lineup') {
      planControls.style.display = 'none';
      main.style.display = 'none';
      lineupView.style.display = '';
      syncHeaderHeightVar();
      renderDayChips();
      renderTimeBuckets();
      renderArtistResults(artistInput.value);
      return;
    }

    // Other tabs: page header visible, main content stack
    main.style.display = '';
    lineupView.style.display = 'none';

    if (state.tab === 'map') {
      planControls.style.display = 'none';
      renderMap();
      return;
    }
    if (state.tab === 'friends') {
      planControls.style.display = 'none';
      if (window.findFriends) window.findFriends.render(main);
      // Auto-fetch GPS so distances are populated. Browser handles the
      // permission prompt on first call; no-op (silent error) if denied.
      locateUser();
      return;
    }
    if (state.tab === 'help') {
      planControls.style.display = 'none';
      renderHelp();
      return;
    }
    planControls.style.display = '';
    renderPlan();
  }

  function renderHelp() {
    main.innerHTML = `

  // ── MAP CALIBRATION (2-anchor precise) ─────────────────────────────────
  // Two verified-precise points anchor the entire GPS ↔ map transform:
  //   1. Downtown EDC (central plaza, small footprint, easy to pinpoint).
  //   2. Gate C/D (permanent LVMS entrance gate, west side of property).
  //      Distance + direction from anchor 1 locks scale + orientation.
  //
  // Both GPS values were verified directly from Google Maps (right-click
  // → coordinates), not estimated from satellite eyeballing. Two precise
  // anchors beats four fuzzy ones because the math is an EXACT fit
  // through both points — no least-squares averaging.
  //
  // Why these two specifically:
  //   • Downtown EDC is Insomniac's branded central plaza, placed at
  //     the natural geometric center of the LVMS infield. The same
  //     spot every year.
  //   • Gate C/D is permanent LVMS infrastructure (the road entrance
  //     building on the west side). Won't move in 2026 or any future
  //     year — concrete, lit, surveyed.
  //
  // The math: two independent 1-D linear fits (top%↔lat, left%↔lng).
  // Handles non-uniform stretching (Insomniac's portrait map squishes
  // the wide-but-short LVMS oval into a tall rectangle). Assumes the
  // map is approximately north-up — confirmed visually on the 2025 map
  // (Gate C/D shows upper-left of Downtown EDC, matching its real NW
  // position).
  //
  // YEARLY UPDATE WHEN A NEW MAP DROPS:
  //   • GPS values: do NOT change. Both points are at the same physical
  //     spot every year (Downtown EDC plaza + concrete LVMS gate).
  //   • mapPct values: re-eyeball where each anchor lands on the new
  //     image and update.
  const SPEEDWAY_ANCHORS = [
    { name: 'Downtown EDC', mapPct: { left: 35.85, top: 54.97 }, gps: { lat: 36.272914,          lng: -115.011007          } },
    { name: 'Gate C/D',     mapPct: { left:  8.34, top: 54.02 }, gps: { lat: 36.27498535179921,  lng: -115.01313780128011  } },
    { name: 'Oval Top',     mapPct: { left: 40.89, top:  9.21 }, gps: { lat: 36.27481793053691,  lng: -115.00627038603729  } },
    { name: 'Oval Bottom',  mapPct: { left: 41.04, top: 97.73 }, gps: { lat: 36.269574134943305, lng: -115.01424058659038  } },
    { name: 'Oval East',    mapPct: { left: 72.80, top: 54.01 }, gps: { lat: 36.27065185384524,  lng: -115.00866203499909  } },
  ];

  // Festival map's pixel dimensions. Only used by the 2-anchor similarity
  // fallback to convert mapPct → isotropic pixels (so rotation is
  // well-defined). The ≥3-anchor affine path doesn't need them — it works
  // on (lat, lng) and (left%, top%) directly.
  const MAP_IMG_W = 1196;
  const MAP_IMG_H = 1500;

  // Convert real-world GPS to local meters (east, north) relative to a ref.
  function gpsToLocalMeters(lat, lng, refLat, refLng) {
    const M_PER_DEG_LAT = 111320;
    const M_PER_DEG_LNG = 111320 * Math.cos(refLat * Math.PI / 180);
    return {
      east:  (lng - refLng) * M_PER_DEG_LNG,
      north: (lat - refLat) * M_PER_DEG_LAT,
    };
  }

  // ── Math helpers ────────────────────────────────────────────────────────
  // Solve a 3×3 linear system M·β = b via Cramer's rule. Used by the
  // affine least-squares fitter below.
  function solve3x3(M, b) {
    const det = (m) =>
      m[0][0] * (m[1][1] * m[2][2] - m[1][2] * m[2][1]) -
      m[0][1] * (m[1][0] * m[2][2] - m[1][2] * m[2][0]) +
      m[0][2] * (m[1][0] * m[2][1] - m[1][1] * m[2][0]);
    const D = det(M);
    const M0 = [[b[0], M[0][1], M[0][2]], [b[1], M[1][1], M[1][2]], [b[2], M[2][1], M[2][2]]];
    const M1 = [[M[0][0], b[0], M[0][2]], [M[1][0], b[1], M[1][2]], [M[2][0], b[2], M[2][2]]];
    const M2 = [[M[0][0], M[0][1], b[0]], [M[1][0], M[1][1], b[1]], [M[2][0], M[2][1], b[2]]];
    return [det(M0) / D, det(M1) / D, det(M2) / D];
  }

  // Least-squares fit y = β₀·x₁ + β₁·x₂ + β₂. Solved via the normal
  // equations Xᵀ·X·β = Xᵀ·y, where X = [x₁, x₂, 1].
  function fitLinear3(x1s, x2s, ys) {
    let s11 = 0, s12 = 0, s1 = 0, s22 = 0, s2 = 0;
    let sy1 = 0, sy2 = 0, sy = 0;
    const n = x1s.length;
    for (let i = 0; i < n; i++) {
      const a = x1s[i], b = x2s[i], y = ys[i];
      s11 += a * a; s12 += a * b; s1 += a;
      s22 += b * b; s2 += b;
      sy1 += a * y; sy2 += b * y; sy += y;
    }
    return solve3x3([[s11, s12, s1], [s12, s22, s2], [s1, s2, n]], [sy1, sy2, sy]);
  }

  // ── 2-anchor similarity transform (rotation + uniform scale + translation)
  // Used when SPEEDWAY_ANCHORS has exactly 2 entries. Exact fit at both
  // anchors, but assumes uniform scale — won't capture map non-uniform
  // stretching (which Insomniac's portrait artwork has). Adding a 3rd
  // anchor switches us to affine least-squares (see below) which does.
  // Math via complex multiplication:
  //   z_pixel = factor * w_meters + offset
  //   factor = (a + b·i) encodes scale + rotation
  //   w_meters = east + (-north)·i  (screen-y-down convention)
  function fitSimilarity(anchors) {
    const A = anchors[0], B = anchors[1];
    const refLat = A.gps.lat, refLng = A.gps.lng;
    const zAx = A.mapPct.left / 100 * MAP_IMG_W;
    const zAy = A.mapPct.top  / 100 * MAP_IMG_H;
    const zBx = B.mapPct.left / 100 * MAP_IMG_W;
    const zBy = B.mapPct.top  / 100 * MAP_IMG_H;
    const mB = gpsToLocalMeters(B.gps.lat, B.gps.lng, refLat, refLng);
    const wRe = mB.east, wIm = -mB.north;
    const dzRe = zBx - zAx, dzIm = zBy - zAy;
    const denom = wRe * wRe + wIm * wIm;
    const fRe = (dzRe * wRe + dzIm * wIm) / denom;
    const fIm = (dzIm * wRe - dzRe * wIm) / denom;
    return {
      kind: 'similarity',
      transform(lat, lng) {
        const m = gpsToLocalMeters(lat, lng, refLat, refLng);
        const wr = m.east, wi = -m.north;
        const zx = fRe * wr - fIm * wi + zAx;
        const zy = fRe * wi + fIm * wr + zAy;
        return { left: zx / MAP_IMG_W * 100, top: zy / MAP_IMG_H * 100 };
      },
      // Compass: convert real-world heading (0=N, 90=E, cw) to the cone's
      // CSS rotate value (cw from screen-up). Accounts for the map's
      // rotation so the cone points where the user actually faces ON THE
      // MAP, not where it'd face on a north-up map.
      headingToScreenAngle(heading) {
        const H = heading * Math.PI / 180;
        const e = Math.sin(H), n = Math.cos(H);
        const sx = fRe * e + fIm * n;
        const sy = fIm * e - fRe * n;
        return Math.atan2(sx, -sy) * 180 / Math.PI;
      },
    };
  }

  // ── Multi-anchor affine least-squares (≥3 anchors) + IDW residual correction
  // Stage 1: fits the 6-parameter affine transform from local meters
  // (relative to anchor[0]) to map percent:
  //   left% = aL·east + bL·north + cL
  //   top%  = aT·east + bT·north + cT
  // Two independent 3-param least-squares fits via normal equations.
  // Handles rotation + non-uniform scale + skew. Operates in METERS
  // (not raw lat/lng) for numerical conditioning.
  //
  // Stage 2: inverse-distance-weighted residual correction so each
  // anchor's pin lands EXACTLY on its dragged mapPct. The festival
  // map has non-linear distortion (artistic stretching) that an affine
  // fit can't fully capture — leaving residuals up to ~5% at some
  // anchors. IDW takes those residuals and smoothly interpolates them
  // between anchors, collapsing to the exact residual at each anchor
  // (zero error there) and fading out far away (where pure affine
  // takes over).
  function fitAffine(anchors) {
    const refLat = anchors[0].gps.lat;
    const refLng = anchors[0].gps.lng;
    const meters = anchors.map(a => gpsToLocalMeters(a.gps.lat, a.gps.lng, refLat, refLng));
    const easts  = meters.map(m => m.east);
    const norths = meters.map(m => m.north);
    const lefts  = anchors.map(a => a.mapPct.left);
    const tops   = anchors.map(a => a.mapPct.top);
    const [aL, bL, cL] = fitLinear3(easts, norths, lefts);
    const [aT, bT, cT] = fitLinear3(easts, norths, tops);

    // Per-anchor residuals: how far the affine fit misses each anchor.
    const residuals = anchors.map((a, i) => ({
      east:  easts[i],
      north: norths[i],
      dLeft: a.mapPct.left - (aL * easts[i] + bL * norths[i] + cL),
      dTop:  a.mapPct.top  - (aT * easts[i] + bT * norths[i] + cT),
    }));

    return {
      kind: 'affine',
      transform(lat, lng) {
        const m = gpsToLocalMeters(lat, lng, refLat, refLng);
        const baseLeft = aL * m.east + bL * m.north + cL;
        const baseTop  = aT * m.east + bT * m.north + cT;

        // IDW (1/d²) weighted residual correction.
        let totalW = 0, dLeftSum = 0, dTopSum = 0;
        for (const r of residuals) {
          const dx = m.east - r.east;
          const dy = m.north - r.north;
          const d2 = dx * dx + dy * dy;
          if (d2 < 25) {  // within 5m of an anchor → snap to it exactly
            return { left: baseLeft + r.dLeft, top: baseTop + r.dTop };
          }
          const w = 1 / d2;
          totalW   += w;
          dLeftSum += w * r.dLeft;
          dTopSum  += w * r.dTop;
        }
        return {
          left: baseLeft + dLeftSum / totalW,
          top:  baseTop  + dTopSum  / totalW,
        };
      },
      // Compass: convert real-world heading (0=N, 90=E, cw) to the cone's
      // CSS rotate value (cw from screen-up). Uses the affine transform's
      // linear part directly; (left%, top%) is screen-y-down so we flip
      // the y component to get screen-up.
      headingToScreenAngle(heading) {
        const H = heading * Math.PI / 180;
        const e = Math.sin(H), n = Math.cos(H);
        const mx = aL * e + bL * n;
        const my = aT * e + bT * n;
        return Math.atan2(mx, -my) * 180 / Math.PI;
      },
    };
  }

  // Pick the right model based on how many anchors we have.
  const _xform = SPEEDWAY_ANCHORS.length >= 3
    ? fitAffine(SPEEDWAY_ANCHORS)
    : fitSimilarity(SPEEDWAY_ANCHORS);

  // Festival "center" for distance calc — Downtown EDC plaza (anchor 1).
  const FESTIVAL_CENTER_GPS = SPEEDWAY_ANCHORS[0].gps;

  // (Map rotation is now derived from the calibration anchors, not
  // hardcoded — see _xform.headingToScreenAngle below.)

  // Haversine distance in meters between two GPS points.
  function haversineMeters(lat1, lng1, lat2, lng2) {
    const R = 6371000;
    const φ1 = lat1 * Math.PI / 180, φ2 = lat2 * Math.PI / 180;
    const Δφ = (lat2 - lat1) * Math.PI / 180, Δλ = (lng2 - lng1) * Math.PI / 180;
    const a = Math.sin(Δφ/2) ** 2 + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ/2) ** 2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }
  // US-friendly format: feet under a quarter mile, miles otherwise.
  function formatImperialDistance(m) {
    const ft = m * 3.28084;
    if (ft < 1320) return Math.round(ft / 50) * 50 + ' ft';
    const mi = m / 1609.344;
    if (mi < 10)   return mi.toFixed(1) + ' mi';
    if (mi < 100)  return Math.round(mi) + ' mi';
    return Math.round(mi / 10) * 10 + ' mi';
  }

  // GPS → map-percent. Dispatches to whichever transform the
  // anchor-count picked (similarity for 2, affine for ≥3).
  function gpsToMapPercent(lat, lng) {
    const { left, top } = _xform.transform(lat, lng);
    const inBounds = top >= 0 && top <= 100 && left >= 0 && left <= 100;
    return { left, top, inBounds };
  }

  // map-percent → GPS, via Newton's method on the forward transform.
  // Used when the user drags a pin and we need to store the new GPS.
  // Converges in ~5-8 iterations for any point inside or near the map.
  function mapPercentToGps(targetLeft, targetTop) {
    let lat = SPEEDWAY_ANCHORS[0].gps.lat;
    let lng = SPEEDWAY_ANCHORS[0].gps.lng;
    for (let i = 0; i < 30; i++) {
      const pred = gpsToMapPercent(lat, lng);
      const dLeft = targetLeft - pred.left;
      const dTop  = targetTop  - pred.top;
      if (Math.abs(dLeft) < 0.001 && Math.abs(dTop) < 0.001) break;
      const eps = 0.0001;
      const pLat = gpsToMapPercent(lat + eps, lng);
      const pLng = gpsToMapPercent(lat, lng + eps);
      const dLeft_dLat = (pLat.left - pred.left) / eps;
      const dTop_dLat  = (pLat.top  - pred.top)  / eps;
      const dLeft_dLng = (pLng.left - pred.left) / eps;
      const dTop_dLng  = (pLng.top  - pred.top)  / eps;
      const det = dLeft_dLat * dTop_dLng - dLeft_dLng * dTop_dLat;
      if (Math.abs(det) < 1e-10) break;
      lat += (dTop_dLng * dLeft - dLeft_dLng * dTop) / det;
      lng += (-dTop_dLat * dLeft + dLeft_dLat * dTop) / det;
    }
    return { lat, lng };
  }

  function renderMap() {

          'Drop a pin here',
          {
            placeholder: 'Short message · e.g., BAR · 11pm meetup',
            primaryLabel: 'Drop',
            maxLength: 100,
          }
        );
        if (!message) return;
        const ok = await window.findFriends.dropMyPin(message);
        if (!ok) console.warn('[pin] drop failed');
      }
    };
  }

  // Group pin button: mirrors the personal-pin pattern. When no group
  // pin exists, button drops one. When one exists, button clears it.
  // To change a pinned message, clear and re-drop (same convention as
  // personal pin — keeps the two pins behaviourally identical).
  function setupGroupPinButton() {
    const btn = document.getElementById('groupPinBtn');
    if (!btn) return;
    function refresh() {
      if (!window.findFriends || !window.findFriends.inGroup()) return;
      const gp = window.findFriends.getGroupPin && window.findFriends.getGroupPin();
      btn.textContent = gp ? '⭐ Remove group pin' : '⭐ Drop group pin';
      btn.dataset.action = gp ? 'remove' : 'drop';
    }
    refresh();
    window.addEventListener('myraver-grouppin-update', refresh);
    window.addEventListener('myraver-friend-update', refresh);
    btn.onclick = async () => {
      if (!window.findFriends || !window.findFriends.inGroup()) return;
      if (btn.dataset.action === 'remove') {
        const ok = await window.findFriends.confirm(
          'Remove the group pin?<br>Everyone in the group loses it.',
          { primaryLabel: 'Remove', danger: true }
        );
        if (ok) await window.findFriends.clearGroupPin();
      } else {
        const message = await window.findFriends.prompt(
          'Drop group pin here. Add a message:',
          {
            placeholder: 'Short message · e.g., MEET HERE 1AM',
            primaryLabel: 'Drop',
            maxLength: 100,
          }
        );
        if (!message) return;
        const ok = await window.findFriends.dropGroupPin(message);
        if (!ok) console.warn('[grouppin] drop failed');
      }
    };
  }

  // v210: render all meeting pins for the current group. Stick + ball,
  // colored by dropper. Uses gpsToMapPercent like friend pins.
  function renderMeetingPins() {
    const container = document.getElementById('meetingPins');
    if (!container) return;
    container.innerHTML = '';
    if (!window.findFriends || !window.findFriends.getPins) return;
    const pins = window.findFriends.getPins();
    pins.forEach(p => {
      const pos = gpsToMapPercent(p.lat, p.lng);
      if (pos.left < -10 || pos.left > 110 || pos.top < -10 || pos.top > 110) return;
      const el = document.createElement('div');
      el.className = 'meeting-pin' + (p.isMine ? ' is-mine' : '');
      el.style.setProperty('--mp-color', p.color);
      el.style.left = Math.max(0, Math.min(100, pos.left)) + '%';
      el.style.top  = Math.max(0, Math.min(100, pos.top))  + '%';
      el.dataset.qrid = p.qrid;
      el.innerHTML = `
        <div class="meeting-pin-shape">
          <div class="meeting-pin-text">${(p.initial || '?').replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))}</div>
        </div>
      `;
      // Non-mine pins: simple click. Mine: drag handler distinguishes tap vs drag.
      if (p.isMine) {
        attachPinDrag(el, p);
      } else {
        el.onclick = (e) => { e.stopPropagation(); showPinSheet(p); };
      }
      container.appendChild(el);
    });

    // Group pin (one per group, gold). Glows when updated by someone else
    // until we open its sheet (ackGroupPin clears the freshness).
    const gp = window.findFriends.getGroupPin && window.findFriends.getGroupPin();
    if (gp && typeof gp.lat === 'number' && typeof gp.lng === 'number') {
      const pos = gpsToMapPercent(gp.lat, gp.lng);
      if (pos.left >= -10 && pos.left <= 110 && pos.top >= -10 && pos.top <= 110) {
        const fresh = window.findFriends.isGroupPinFresh && window.findFriends.isGroupPinFresh();
        const el = document.createElement('div');
        el.className = 'meeting-pin is-group' + (fresh ? ' is-fresh' : '');
        el.style.left = Math.max(0, Math.min(100, pos.left)) + '%';
        el.style.top  = Math.max(0, Math.min(100, pos.top))  + '%';
        el.innerHTML = `
          <div class="meeting-pin-shape">
            <div class="meeting-pin-text">⭐</div>
          </div>
        `;
        // Drag-to-move + tap-to-open like personal pins. Group pin is a
        // shared object — every move is a contribution to the group plan,
        // so always prompt with the current message pre-filled. Tap Save
        // to keep (one tap), edit then Save to update, or X/Esc to cancel
        // (re-render reverts the visual position from local state).
        attachPinDrag(el, null, {
          onTap: () => showGroupPinSheet(),
          onCommit: async (lat, lng) => {
            if (!window.findFriends) return;
            const gp = window.findFriends.getGroupPin && window.findFriends.getGroupPin();
            if (!gp) return;
            const newMsg = await window.findFriends.prompt(
              'Move group pin here? Add a message:',
              {
                defaultValue: gp.message || '',
                placeholder: 'Short message',
                primaryLabel: 'Save',
                maxLength: 100,
              }
            );
            if (!newMsg) {
              renderMeetingPins();
              return;
            }
            await window.findFriends.dropGroupPin(newMsg, lat, lng);
          },
        });
        container.appendChild(el);
      }
    }
  }

  // Bottom sheet for the group pin: shows "by whom · time ago · message"

  // Pin info sheet — tap a pin to read who/what/when. Pure info, no

  function showPinSheet(pin) {

    const wrap = document.querySelector('.map-img-container');

    sheet.className = 'friend-sheet friend-sheet-pin';
