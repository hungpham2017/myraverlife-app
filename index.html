  // ── Multi-anchor affine least-squares (≥3 anchors) + IDW residual correction
  // Stage 1: fits the 6-parameter affine transform from local meters
  // (relative to anchor[0]) to map percent:
  //   left% = aL·east + bL·north + cL
  //   top%  = aT·east + bT·north + cT
  // Two independent 3-param least-squares fits via normal equations.
  // Handles rotation + non-uniform scale + skew. Operates in METERS
  // (not raw lat/lng) for numerical conditioning.
  //
  // Stage 2: inverse-distance-weighted residual correction so each
  // anchor's pin lands EXACTLY on its dragged mapPct. The festival
  // map has non-linear distortion (artistic stretching) that an affine
  // fit can't fully capture — leaving residuals up to ~5% at some
  // anchors. IDW takes those residuals and smoothly interpolates them
  // between anchors, collapsing to the exact residual at each anchor
  // (zero error there) and fading out far away (where pure affine
  // takes over).
  function fitAffine(anchors) {
    const refLat = anchors[0].gps.lat;
    const refLng = anchors[0].gps.lng;
    const meters = anchors.map(a => gpsToLocalMeters(a.gps.lat, a.gps.lng, refLat, refLng));
    const easts  = meters.map(m => m.east);
    const norths = meters.map(m => m.north);
    const lefts  = anchors.map(a => a.mapPct.left);
    const tops   = anchors.map(a => a.mapPct.top);
    const [aL, bL, cL] = fitLinear3(easts, norths, lefts);
    const [aT, bT, cT] = fitLinear3(easts, norths, tops);

    // Per-anchor residuals: how far the affine fit misses each anchor.
    const residuals = anchors.map((a, i) => ({
      east:  easts[i],
      north: norths[i],
      dLeft: a.mapPct.left - (aL * easts[i] + bL * norths[i] + cL),
      dTop:  a.mapPct.top  - (aT * easts[i] + bT * norths[i] + cT),
    }));

    return {
      kind: 'affine',
      transform(lat, lng) {
        const m = gpsToLocalMeters(lat, lng, refLat, refLng);
        const baseLeft = aL * m.east + bL * m.north + cL;
        const baseTop  = aT * m.east + bT * m.north + cT;

        // IDW (1/d²) weighted residual correction.
        let totalW = 0, dLeftSum = 0, dTopSum = 0;
        for (const r of residuals) {
          const dx = m.east - r.east;
          const dy = m.north - r.north;
          const d2 = dx * dx + dy * dy;
          if (d2 < 25) {  // within 5m of an anchor → snap to it exactly
            return { left: baseLeft + r.dLeft, top: baseTop + r.dTop };
          }
          const w = 1 / d2;
          totalW   += w;
          dLeftSum += w * r.dLeft;
          dTopSum  += w * r.dTop;
        }
        return {
          left: baseLeft + dLeftSum / totalW,
          top:  baseTop  + dTopSum  / totalW,
        };
      },
      // Compass: convert real-world heading (0=N, 90=E, cw) to the cone's
      // CSS rotate value (cw from screen-up). Uses the affine transform's
      // linear part directly; (left%, top%) is screen-y-down so we flip
      // the y component to get screen-up.
      headingToScreenAngle(heading) {
        const H = heading * Math.PI / 180;
        const e = Math.sin(H), n = Math.cos(H);
        const mx = aL * e + bL * n;
        const my = aT * e + bT * n;
        return Math.atan2(mx, -my) * 180 / Math.PI;
      },
    };
  }

  // Pick the right model based on how many anchors we have.
  const _xform = SPEEDWAY_ANCHORS.length >= 3
    ? fitAffine(SPEEDWAY_ANCHORS)
    : fitSimilarity(SPEEDWAY_ANCHORS);

  // Festival "center" for distance calc — Downtown EDC plaza (anchor 1).
  const FESTIVAL_CENTER_GPS = SPEEDWAY_ANCHORS[0].gps;

  // (Map rotation is now derived from the calibration anchors, not
  // hardcoded — see _xform.headingToScreenAngle below.)

  // Haversine distance in meters between two GPS points.
  function haversineMeters(lat1, lng1, lat2, lng2) {
    const R = 6371000;
    const φ1 = lat1 * Math.PI / 180, φ2 = lat2 * Math.PI / 180;
    const Δφ = (lat2 - lat1) * Math.PI / 180, Δλ = (lng2 - lng1) * Math.PI / 180;
    const a = Math.sin(Δφ/2) ** 2 + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ/2) ** 2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }
  // US-friendly format: feet under a quarter mile, miles otherwise.
  function formatImperialDistance(m) {
    const ft = m * 3.28084;
    if (ft < 1320) return Math.round(ft / 50) * 50 + ' ft';
    const mi = m / 1609.344;
    if (mi < 10)   return mi.toFixed(1) + ' mi';
    if (mi < 100)  return Math.round(mi) + ' mi';
    return Math.round(mi / 10) * 10 + ' mi';
  }

  // GPS → map-percent. Dispatches to whichever transform the
  // anchor-count picked (similarity for 2, affine for ≥3).
  function gpsToMapPercent(lat, lng) {
    const { left, top } = _xform.transform(lat, lng);
    const inBounds = top >= 0 && top <= 100 && left >= 0 && left <= 100;
    return { left, top, inBounds };
  }

  function renderMap() {
    main.innerHTML = '';
    const wrap = document.createElement('div');
    wrap.className = 'map-wrap';

    wrap.innerHTML = `
      <div class="map-img-container" id="mapContainer">
        <div class="map-zoom-target" id="mapZoomTarget">
          <img class="map-img" src="${FESTIVAL_MAP_URL}" alt="EDC Las Vegas festival map" draggable="false" />
          <div class="user-pin" id="userPin" style="display:none">
            <span class="user-pin-cone" id="userPinCone"></span>
            <span class="user-pin-pulse"></span>
            <span class="user-pin-dot"></span>
          </div>
        </div>
        <div class="map-far-msg" id="mapFarMsg" style="display:none"></div>
        <div class="map-zoom-controls">
          <button type="button" class="map-zoom-btn" id="gpsBtn"     aria-label="Find my location">📍</button>
          <button type="button" class="map-zoom-btn" data-zoom="in"  aria-label="Zoom in">⊕</button>
          <button type="button" class="map-zoom-btn" data-zoom="out" aria-label="Zoom out">⊖</button>
          <button type="button" class="map-zoom-btn" data-zoom="reset" aria-label="Reset zoom">↺</button>
        </div>
        <div class="map-status" id="mapStatus" aria-live="polite"></div>
      </div>
      <p class="map-note">
        Loaded live from <a href="https://lasvegas.electricdaisycarnival.com/experience/festival-map/" target="_blank" rel="noopener">edclasvegas.com</a> · currently the 2025 layout · auto-updates once Insomniac publishes the 2026 map.
      </p>
    `;

    main.appendChild(wrap);
    setupMapZoom(wrap.querySelector('#mapContainer'), wrap.querySelector('#mapZoomTarget'));
    wrap.querySelector('#gpsBtn').onclick = (e) => { e.stopPropagation(); locateUser(); };

    // Auto-show the user's pin on Map tab open IF they've already granted
    // geolocation permission. First-time visitors still need to tap the
    // GPS button (which triggers the permission prompt). After grant,
    // the pin is always there immediately on every Map tab visit.
    if (navigator.permissions) {
      navigator.permissions.query({ name: 'geolocation' })
        .then(p => { if (p.state === 'granted') locateUser(); })
        .catch(() => {});
    }
  }

  // ── GPS "you are here" ──────────────────────────────────────────────────
  let userHeading = null;
  let compassAttached = false;

  function setMapStatus(msg) {
    const s = document.getElementById('mapStatus');
    if (s) {
      s.textContent = msg || '';
      s.style.display = msg ? 'block' : 'none';
    }
  }

  function locateUser() {
    if (!navigator.geolocation) {
      setMapStatus('GPS not available');
      setTimeout(() => setMapStatus(''), 2200);
      return;
    }
    setMapStatus('finding you…');
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const { latitude, longitude } = pos.coords;
        // tooFar = pin would land more than ~30% of the map's dimensions
        // beyond any edge. That gives ~1km of slack around the festival
        // bounds (the rotated map covers ~1km × 1.4km of real area at
        // 0.98 px/m, so 30% ≈ 300-400m). Within this slack, show the
        // pin (clamped to map edge if just outside — useful for users
        // in parking lots, gates, walking up). Beyond this, hide the
        // pin silently and show the cute distance message instead.
        const p = gpsToMapPercent(latitude, longitude);
        const FAR_PCT = 30;
        const tooFar = (
          p.left < -FAR_PCT || p.left > 100 + FAR_PCT ||
          p.top  < -FAR_PCT || p.top  > 100 + FAR_PCT
        );
        const farMsg = document.getElementById('mapFarMsg');
        if (tooFar) {
          const pin = document.getElementById('userPin');
          if (pin) pin.style.display = 'none';
          if (farMsg) {
            const distM = haversineMeters(latitude, longitude, FESTIVAL_CENTER_GPS.lat, FESTIVAL_CENTER_GPS.lng);
            farMsg.innerHTML = `You're ${formatImperialDistance(distM)} from the Speedway ✨<br><span class="map-far-sub">Your pin lands here when you arrive</span>`;
            farMsg.style.display = '';
          }
          setMapStatus('');
          return;
        }
        // On or near the festival — hide the far-away message.
        if (farMsg) farMsg.style.display = 'none';
        // placePin clamps 0-100%, so out-of-map-but-close coords land on
        // the nearest map edge — visually meaningful "you're nearby."
        placePin(p.left, p.top);
        if (mapZoom.panToImagePct) mapZoom.panToImagePct(p.left, p.top);
        setMapStatus('');
        startCompass();
      },
      (err) => {
        setMapStatus(err.code === 1 ? 'permission denied' : 'no GPS fix');
        setTimeout(() => setMapStatus(''), 2500);
      },
      { enableHighAccuracy: true, timeout: 30000, maximumAge: 30000 }
    );
  }

  function placePin(leftPct, topPct) {
    const pin = document.getElementById('userPin');
    if (!pin) return;
    pin.style.left = Math.max(0, Math.min(100, leftPct)) + '%';
    pin.style.top  = Math.max(0, Math.min(100, topPct))  + '%';
    pin.style.display = '';
  }

  function startCompass() {
    if (compassAttached) return;
    // iOS 13+ requires explicit permission via user gesture (the GPS button).
    const Req = window.DeviceOrientationEvent && window.DeviceOrientationEvent.requestPermission;
    if (typeof Req === 'function') {
      Req().then(perm => {
        if (perm === 'granted') attachCompass();
      }).catch(() => {});
    } else {
      attachCompass();
    }
  }

  function attachCompass() {
    if (compassAttached) return;
    compassAttached = true;
    window.addEventListener('deviceorientationabsolute', onOrient, true);
    window.addEventListener('deviceorientation', onOrient, true);
  }

  // Smoothing buffer for compass — phone sensors fire at 30+ Hz which makes
  // the cone twitch. We low-pass-filter and throttle DOM writes via rAF.
  let smoothedHeading = null;
  let conePending = false;
  const SMOOTH_FACTOR = 0.18;     // 0 = no smoothing, 1 = no smoothing-effect

  function onOrient(e) {
    let heading = null;
    if (typeof e.webkitCompassHeading === 'number') {
      heading = e.webkitCompassHeading;       // iOS: clockwise from true north
    } else if (e.alpha != null && e.absolute) {
      heading = (360 - e.alpha) % 360;         // standard alpha is counterclockwise
    }
    if (heading == null) return;

    if (smoothedHeading == null) {
      smoothedHeading = heading;
    } else {
      // Handle the 360/0 wrap so we always rotate the short way.
      let diff = heading - smoothedHeading;
      if (diff > 180)  diff -= 360;
      if (diff < -180) diff += 360;
      smoothedHeading = (smoothedHeading + diff * SMOOTH_FACTOR + 360) % 360;
    }
    userHeading = smoothedHeading;

    if (!conePending) {
      conePending = true;
      requestAnimationFrame(() => {
        conePending = false;
        const cone = document.getElementById('userPinCone');
        if (cone) cone.style.transform = `rotate(${_xform.headingToScreenAngle(smoothedHeading)}deg)`;
      });
    }
  }

  // Module-scoped so other map features (drop-pin) can read the live state.
  const mapZoom = { scale: 1, tx: 0, ty: 0, container: null };

  // Inline pinch-zoom + pan for the map. Single transform (scale + translate)
  // applied to the zoom-target so img + hotspots scale together.
  function setupMapZoom(container, target) {
    mapZoom.container = container;
    let scale = mapZoom.scale = 1, tx = mapZoom.tx = 0, ty = mapZoom.ty = 0;
    const MIN = 1, MAX = 4;

    function clamp() {
      // Keep scaled content within container bounds (no panning into empty space).
      const cw = container.clientWidth, ch = container.clientHeight;
      const maxX = Math.max(0, (cw * scale - cw) / 2);
      const maxY = Math.max(0, (ch * scale - ch) / 2);
      tx = Math.max(-maxX, Math.min(maxX, tx));
      ty = Math.max(-maxY, Math.min(maxY, ty));
    }
    function apply() {
      clamp();
      target.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
      mapZoom.scale = scale; mapZoom.tx = tx; mapZoom.ty = ty;
      // Counter-scale GPS pin so it stays constant on-screen (Google Maps style)
      const pin = document.getElementById('userPin');
      if (pin) pin.style.transform = `scale(${1 / scale})`;
    }
    function reset() { scale = 1; tx = 0; ty = 0; apply(); }

    // If the pin is offscreen, recenter the viewport on it. If it's already
    // visible, leave the map alone. Math accounts for transform-origin: center.
    mapZoom.panToImagePct = (leftPct, topPct) => {
      if (scale <= 1) return; // at zoom 1 the whole map is visible
      const cw = container.clientWidth, ch = container.clientHeight;
      const imgX = (leftPct / 100) * cw;
      const imgY = (topPct  / 100) * ch;
      // Real screen position with center transform-origin:
      // screenX = tx + imgX*scale + cw/2*(1-scale)
      const offX = (cw / 2) * (1 - scale);
      const offY = (ch / 2) * (1 - scale);
      const screenX = tx + imgX * scale + offX;
      const screenY = ty + imgY * scale + offY;
      const MARGIN = 32;
      const inView = screenX >= MARGIN && screenX <= cw - MARGIN
                  && screenY >= MARGIN && screenY <= ch - MARGIN;
      if (inView) return;    // already visible — leave the map alone
      // Pan to center the pin: solve screenX_target = cw/2.
      tx = (cw / 2 - imgX) * scale;
      ty = (ch / 2 - imgY) * scale;
      apply();
    };

    // Buttons
    container.querySelectorAll('.map-zoom-btn').forEach(btn => {
      btn.onclick = (e) => {
        e.stopPropagation();
        const action = btn.dataset.zoom;
        if (action === 'in')        scale = Math.min(MAX, scale * 1.5);
        else if (action === 'out')  scale = Math.max(MIN, scale / 1.5);
        else if (action === 'reset') { reset(); return; }
        apply();
      };
    });

    // Pinch-zoom (2 fingers) + pan (1 finger when zoomed)
    let pinchStart = null, panStart = null;
    function dist(t) {
      const dx = t[0].clientX - t[1].clientX;
      const dy = t[0].clientY - t[1].clientY;
      return Math.hypot(dx, dy);
    }
    function midpoint(t) {
      return {
        x: (t[0].clientX + t[1].clientX) / 2,
        y: (t[0].clientY + t[1].clientY) / 2,
      };
    }

    container.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) {
        pinchStart = { dist: dist(e.touches), scale, mid: midpoint(e.touches), tx, ty };
        panStart = null;
      } else if (e.touches.length === 1 && scale > 1) {
        panStart = { x: e.touches[0].clientX, y: e.touches[0].clientY, tx, ty };
        pinchStart = null;
      }
    }, { passive: true });

    container.addEventListener('touchmove', (e) => {
      // Always block native scrolling when the touch started on the map —
      // otherwise iOS lets a 1-finger drag at scale=1 move the page.
      e.preventDefault();
      if (e.touches.length === 2 && pinchStart) {
        const newDist = dist(e.touches);
        scale = Math.max(MIN, Math.min(MAX, pinchStart.scale * (newDist / pinchStart.dist)));
        apply();
      } else if (e.touches.length === 1 && panStart && scale > 1) {
        tx = panStart.tx + (e.touches[0].clientX - panStart.x);
        ty = panStart.ty + (e.touches[0].clientY - panStart.y);
        apply();
      }
    }, { passive: false });

    container.addEventListener('touchend', (e) => {
      // Pinch ended (one finger lifted)? Transition to pan with remaining finger.
      if (e.touches.length < 2) pinchStart = null;
      if (e.touches.length === 0) {
        panStart = null;
      } else if (e.touches.length === 1 && !panStart && scale > 1) {
        panStart = { x: e.touches[0].clientX, y: e.touches[0].clientY, tx, ty };
      }
    });

    // ── Desktop input (MacBook / mouse / trackpad) ──────────────────────
    function setCursor() {
      container.style.cursor = dragStart
        ? 'grabbing'
        : (scale > 1 ? 'grab' : '');
    }

    // Click-and-drag to pan (only when zoomed in).
    let dragStart = null;
    container.addEventListener('mousedown', (e) => {
      if (scale <= 1) return;
      if (e.target.closest('.map-zoom-btn') || e.target.closest('.user-pin')) return;
      dragStart = { x: e.clientX, y: e.clientY, tx, ty };
      setCursor();
      e.preventDefault();
    });
    window.addEventListener('mousemove', (e) => {
      if (!dragStart) return;
      tx = dragStart.tx + (e.clientX - dragStart.x);
      ty = dragStart.ty + (e.clientY - dragStart.y);
      apply();
    });
    window.addEventListener('mouseup', () => {
      if (!dragStart) return;
      dragStart = null;
      setCursor();
    });

    // Wheel / trackpad scroll = zoom. Trackpad pinch on macOS fires wheel
    // events with ctrlKey=true and a larger deltaY — handle both naturally.
    container.addEventListener('wheel', (e) => {
      e.preventDefault();
      const factor = e.ctrlKey ? 0.02 : 0.005;  // pinch is more sensitive
      const next = scale * Math.exp(-e.deltaY * factor);
      scale = Math.max(MIN, Math.min(MAX, next));
      if (scale === 1) { tx = 0; ty = 0; }
      apply();
      setCursor();
    }, { passive: false });

    // Double-tap (touch) / double-click (mouse) toggles zoom.
    let lastTap = 0;
    container.addEventListener('click', (e) => {
      if (e.target.closest('.map-zoom-btn') || e.target.closest('.user-pin')) return;
      const now = Date.now();
      if (now - lastTap < 300) {
        scale = scale > 1 ? 1 : 2.2;
        if (scale === 1) { tx = 0; ty = 0; }
        apply();
        setCursor();
      }
      lastTap = now;
    });
  }

  function renderPlan() {
    document.querySelectorAll('.night-btn').forEach(b => {
      b.classList.toggle('active', Number(b.dataset.night) === state.night);
    });

    const picks = state.picks[state.night] || [];
    main.innerHTML = '';
    main.appendChild(renderTimeline(picks));

    // Auto-scroll to the first pick so users immediately see WHEN their
    // night starts, not always the empty 5pm hour. Pure DOM operation,
    // fully offline. Block: 'center' shows the first pick in the middle
    // of the viewport with context above (lead-up hour) and below.
    if (picks.length > 0) {
      requestAnimationFrame(() => {
        const firstBlock = document.querySelector('.timeline-block');
        if (firstBlock) firstBlock.scrollIntoView({ behavior: 'smooth', block: 'center' });
      });
    }
  }

  // Pixels per minute on the timeline. 1.7 = ~102px/hour.
  const TIMELINE_PPM = 1.7;
  const HOUR_LABELS = window.FESTIVAL.hourLabels;
  const FESTIVAL_LENGTH_MINS = window.FESTIVAL.dayLengthMins;

  // Assign each pick a lane (column) within its overlap cluster so blocks split horizontally.
  function layoutLanes(picks) {
    const valid = picks.filter(p =>
      typeof p.startMins === 'number' && typeof p.endMins === 'number'
    ).slice().sort((a, b) => a.startMins - b.startMins);

    const layouts = []; // { pick, lane, totalLanes }
    let i = 0;
    while (i < valid.length) {
      // Build cluster of overlapping picks starting at i
      const cluster = [valid[i]];
      let clusterEnd = valid[i].endMins;
      let j = i + 1;
      while (j < valid.length && valid[j].startMins < clusterEnd) {
        cluster.push(valid[j]);
        clusterEnd = Math.max(clusterEnd, valid[j].endMins);
        j++;
      }
      // Within cluster, greedy lane assignment
      const lanes = []; // lane index → latest endMins occupying that lane
      const clusterLayout = [];
      for (const p of cluster) {
        let lane = lanes.findIndex(end => end <= p.startMins);
        if (lane === -1) { lane = lanes.length; lanes.push(p.endMins); }
        else { lanes[lane] = p.endMins; }
        clusterLayout.push({ pick: p, lane });
      }
      const total = lanes.length;
      for (const c of clusterLayout) layouts.push({ ...c, totalLanes: total });
      i = j;
    }
    return layouts;
  }

  // Module-level interval for the live NOW marker. Cleared + reset on
  // every renderTimeline call so day-switching doesn't leak intervals.
  let _nowLineInterval = null;

  // Add / update / remove the "NOW" line based on whether the displayed
  // day matches the currently-active festival night. Self-cleans the
  // interval if the timeline is no longer in the DOM (user switched tab).
  function updateNowLine() {
    const tl = document.querySelector('.timeline');
    if (!tl) {
      if (_nowLineInterval) { clearInterval(_nowLineInterval); _nowLineInterval = null; }
      return;
    }
    const ctx = currentFestivalContext();
    let line = tl.querySelector('.timeline-now');
    if (!ctx || ctx.dayId !== selectedDay) {
      if (line) line.remove();
      return;
    }
    if (!line) {
      line = document.createElement('div');
      line.className = 'timeline-now';
      line.innerHTML = '<span class="timeline-now-pill"></span>';
      tl.appendChild(line);
    }
    line.style.top = (ctx.nowMins * TIMELINE_PPM) + 'px';
    line.querySelector('.timeline-now-pill').textContent = formatMins(ctx.nowMins);
  }

  function renderTimeline(picks) {
    if (_nowLineInterval) { clearInterval(_nowLineInterval); _nowLineInterval = null; }
    const wrap = document.createElement('div');
    wrap.className = 'timeline';
    const totalHeight = FESTIVAL_LENGTH_MINS * TIMELINE_PPM + 12;
    wrap.style.height = totalHeight + 'px';

    // Hour labels + grid lines
    HOUR_LABELS.forEach(h => {
      const top = h.mins * TIMELINE_PPM;
      const lbl = document.createElement('div');
      lbl.className = 'timeline-hour';
      lbl.style.top = top + 'px';
      lbl.textContent = h.label;
      wrap.appendChild(lbl);
      const line = document.createElement('div');
      line.className = 'timeline-line';
      line.style.top = top + 'px';
      wrap.appendChild(line);
    });

    // Blocks live in a wrapper that starts after the hour gutter
    const blocksArea = document.createElement('div');
    blocksArea.className = 'timeline-blocks';
    wrap.appendChild(blocksArea);

    // Pick blocks with lane layout — side-by-side blocks at the same time
    // ARE the overlap signal. No explicit warning needed.
    const layouts = layoutLanes(picks);
    layouts.forEach(({ pick, lane, totalLanes }) => {
      const s = stage(pick.stage);
      const top = pick.startMins * TIMELINE_PPM;
      const height = Math.max(28, (pick.endMins - pick.startMins) * TIMELINE_PPM - 2);
      const widthPct = 100 / totalLanes;
      const leftPct = lane * widthPct;

      const block = document.createElement('div');
      block.className = 'timeline-block';
      block.style.top = top + 'px';
      block.style.height = height + 'px';
      block.style.left = `calc(${leftPct}% + ${leftPct > 0 ? 1 : 0}px)`;
      block.style.width = `calc(${widthPct}% - 3px)`;
      block.style.borderLeftColor = s.color;

      const timeText = `${formatMins(pick.startMins)}–${formatMins(pick.endMins)}`;
      const imageUrl = pick.image || (() => {
        const t = pick.artist.toLowerCase();
        const hit = ARTISTS.find(x =>
          x.name.toLowerCase() === t && x.stage === pick.stage
        );
        return hit ? hit.image : null;
      })();
      // Same sprite as Lineup; display at 76px here. Falls back to direct
      // CloudFront URL if avatar isn't in the bundled sprite.
      const spriteStyle = avatarSpriteStyleFor(imageUrl, 76);
      const imgHTML = spriteStyle
        ? `<span class="b-img" style="${spriteStyle}"></span>`
        : (imageUrl
            ? `<img class="b-img" src="${escape(imageUrl)}" loading="lazy" alt="" onerror="this.style.display='none'" />`
            : '');
      block.innerHTML = `
        ${imgHTML}
        <div class="b-content">
          <div class="b-artist">${escape(pick.artist)}</div>
          <div class="b-stageline" style="color:${s.color}">${escape(s.id)}</div>
          <div class="b-time">${escape(timeText)}</div>
        </div>
        <button class="b-del" aria-label="Remove from schedule">♥</button>
      `;
      block.querySelector('.b-del').onclick = () => deletePick(pick.id);
      blocksArea.appendChild(block);
    });

    // Kick off the live NOW marker. Defer the first call so the wrap is
    // appended to the DOM by the time updateNowLine queries for it.
    setTimeout(updateNowLine, 0);
    _nowLineInterval = setInterval(updateNowLine, 60000);

    return wrap;
  }

  // Lineup view DOM references
  const artistInput = document.getElementById('artistInput');
  // Smart default for the day chip — pure-local logic, works offline.
  // Pre-festival → Friday · During festival night → that day · Post-festival → Sunday.
  let selectedDay = (() => {
    const ctx = currentFestivalContext();
    if (ctx) return ctx.dayId;
    const ts = appNow().getTime();
    const fri5pm = new Date(2026, 4, 15, 17).getTime();
    const sat5pm = new Date(2026, 4, 16, 17).getTime();
    const sun5pm = new Date(2026, 4, 17, 17).getTime();
    const mon7am = new Date(2026, 4, 18,  7).getTime();
    if (ts <  fri5pm) return 1;
    if (ts >= mon7am) return 3;
    if (ts <  sat5pm) return 2;
    if (ts <  sun5pm) return 3;
    return 3;
  })();
  let selectedNow = false;         // Now filter — show only currently-playing acts
  let selectedSort = 'name';       // 'name' (A-Z) or 'stage' (grouped by stage)

  const DAY_LABELS = window.FESTIVAL.days;
  const dayChips = document.getElementById('dayChips');

  function renderDayChips() {
    dayChips.innerHTML = '';
    DAY_LABELS.forEach(d => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'day-chip' + (d.id === selectedDay ? ' active' : '');
      btn.innerHTML = `<span class="name">${d.name}</span><span class="sub">${d.sub}</span>`;
      btn.onclick = () => {
        if (selectedDay === d.id) return;
        selectedDay = d.id;
        // Switching day = explicit intent to see another day. "Now" only
        // makes sense for the current festival night, so auto-clear it.
        // Search persists (independent of day; smart-fallback handles misses).
        if (selectedNow) {
          selectedNow = false;
          renderTimeBuckets();
        }
        renderDayChips();
        renderArtistResults(artistInput.value);
      };
      dayChips.appendChild(btn);
    });
  }

  // Time-bucket chips — Opener / Mid / Peak / Late / Sunrise.
  // Default = any time; tap a chip to filter, tap same chip to clear.
  const timeBucketsEl = document.getElementById('timeBuckets');

  // Single source of "now" — supports the ?now=... testing override.
  function appNow() {
    const override = new URLSearchParams(window.location.search).get('now');
    const d = override ? new Date(override) : new Date();
    return isNaN(d.getTime()) ? new Date() : d;
  }

  // Current festival context: which night is it (1/2/3) and how many minutes
  // into that night are we? Returns null when not within festival hours.
  // Hardcoded to EDC LV 2026: May 15-17 5pm to next-morning 6am.
  function currentFestivalContext() {
    const now = appNow();
    if (now.getFullYear() !== 2026 || now.getMonth() !== 4) return null; // not May 2026
    const d = now.getDate();
    const h = now.getHours();
    const m = now.getMinutes();
    let dayId = null;
    if      (d === 15 && h >= 17)               dayId = 1;  // Fri 5pm onward
    else if (d === 16 && h <  7)                dayId = 1;  // Fri night → Sat dawn
    else if (d === 16 && h >= 17)               dayId = 2;
    else if (d === 17 && h <  7)                dayId = 2;
    else if (d === 17 && h >= 17)               dayId = 3;
    else if (d === 18 && h <  7)                dayId = 3;
    if (dayId == null) return null;
    const DS = window.FESTIVAL.dayStartHour;
    const nowMins = h >= DS ? (h - DS) * 60 + m : (h + 24 - DS) * 60 + m;
    return { dayId, nowMins };
  }

  // Lineup toolbar: 🔴 Now (filter) + Sort toggle (A-Z / Stages).
  function renderTimeBuckets() {
    if (!timeBucketsEl) return;
    timeBucketsEl.innerHTML = '';

    // Now chip
    const nowBtn = document.createElement('button');
    nowBtn.type = 'button';
    nowBtn.className = 'tool-btn now-chip' + (selectedNow ? ' active' : '');
    nowBtn.innerHTML = `<span class="now-dot"></span>Now`;
    nowBtn.onclick = () => {
      selectedNow = !selectedNow;
      if (selectedNow) {
        const ctx = currentFestivalContext();
        if (ctx && selectedDay !== ctx.dayId) {
          selectedDay = ctx.dayId;
          renderDayChips();
        }
      }
      renderTimeBuckets();
      renderArtistResults(artistInput.value);
    };
    timeBucketsEl.appendChild(nowBtn);

    // Open this day's schedule PNG in a new tab
    const schedBtn = document.createElement('button');
    schedBtn.type = 'button';
    schedBtn.className = 'tool-btn';
    schedBtn.setAttribute('aria-label', 'Open full 3-night schedule as one page');
    schedBtn.innerHTML = '↗ One page';
    schedBtn.style.opacity = '0.75';
    schedBtn.style.fontWeight = '500';
    schedBtn.onclick = () => openSchedulePng();
    timeBucketsEl.appendChild(schedBtn);

    // Spacer pushes the sort toggle to the right
    const spacer = document.createElement('div');
    spacer.className = 'tool-spacer';
    timeBucketsEl.appendChild(spacer);

    // Sort toggle (A-Z / Time / Stages) — segmented control
    const sortWrap = document.createElement('div');
    sortWrap.className = 'sort-toggle';
    [['name', 'Name'], ['time', 'Time'], ['stage', 'Stage']].forEach(([id, label]) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'sort-btn' + (selectedSort === id ? ' active' : '');
      b.textContent = label;
      b.onclick = () => {
        if (selectedSort === id) return;
        selectedSort = id;
        renderTimeBuckets();
        renderArtistResults(artistInput.value);
      };
      sortWrap.appendChild(b);
    });
    timeBucketsEl.appendChild(sortWrap);
  }

  const clearArtistBtn = document.getElementById('clearArtistBtn');
  function syncClearBtn() {
    clearArtistBtn.classList.toggle('show', artistInput.value.trim().length > 0);
  }


  // Live search as user types
  artistInput.addEventListener('input', (e) => {
    syncClearBtn();
    renderArtistResults(e.target.value);
  });
  artistInput.addEventListener('focus', () => {
    syncClearBtn();
    renderArtistResults(artistInput.value);
  });
  clearArtistBtn.addEventListener('click', () => {
    artistInput.value = '';
    syncClearBtn();
    renderArtistResults('');
    artistInput.focus();
  });

  const artistResults = document.getElementById('artistResults');

  function escRe(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
  function highlight(name, query) {
    if (!query) return escape(name);
    const q = escRe(query.trim());
    if (!q) return escape(name);
    const re = new RegExp(`(${q})`, 'ig');
    return escape(name).replace(re, '<mark>$1</mark>');
  }

  function renderArtistResults(query) {
    const q = (query || '').trim().toLowerCase();
    const isNow = selectedNow;
    const nowCtx = isNow ? currentFestivalContext() : null;
    const all = ARTISTS
      .filter(a => selectedDay == null || a.day === selectedDay)
      .filter(a => {
        if (!isNow) return true;
        if (!nowCtx) return false;
        if (a.day !== nowCtx.dayId) return false;
        const sm = timeStrToMins(a.start);
        const em = timeStrToMins(a.end);
        if (sm == null || em == null) return false;
        return sm <= nowCtx.nowMins && em >= nowCtx.nowMins;
      })
      .slice();
    // Sort: A-Z (name), Time (chronological), or Stages (grouped + time within).
    // Now respects the chosen sort — combos like Now+A-Z or Now+Stage are useful.
    const useTimeSort = selectedSort === 'time';
    if (useTimeSort) {
      all.sort((a, b) =>
        ((timeStrToMins(a.start) ?? 0) - (timeStrToMins(b.start) ?? 0))
        || a.name.localeCompare(b.name)
      );
    } else if (selectedSort === 'stage') {
      // Group order: stages as defined in festival.config.js; within stage, by time.
      const stageOrder = Object.fromEntries(STAGES.map((s, i) => [s.id, i]));
      all.sort((a, b) => {
        const sa = stageOrder[a.stage] ?? 99;
        const sb = stageOrder[b.stage] ?? 99;
        if (sa !== sb) return sa - sb;
        return ((timeStrToMins(a.start) ?? 0) - (timeStrToMins(b.start) ?? 0))
            || a.name.localeCompare(b.name);
      });
    } else {
      all.sort((a, b) =>
        a.name.localeCompare(b.name, undefined, { sensitivity: 'base' })
      );
    }
    // Match artist name OR stage id.
    const filtered = q
      ? all.filter(a =>
          a.name.toLowerCase().includes(q) ||
          a.stage.toLowerCase().includes(q)
        )
      : all;

    artistResults.innerHTML = '';
    if (filtered.length === 0) {
      const e = document.createElement('div');
      e.className = 'artist-result-empty';
      if (q) {
        // Smart fallback: ignore day + Now filters, find ALL name/stage matches.
        const allHits = ARTISTS.filter(a =>
          a.name.toLowerCase().includes(q) || a.stage.toLowerCase().includes(q)
        );
        const dayShort = { 1: 'Fri', 2: 'Sat', 3: 'Sun' };
        const dayName = { 1: 'Friday', 2: 'Saturday', 3: 'Sunday' };
        // Describe what the user IS filtering by, so the empty state explains
        // *why* nothing matched (not just "no results").
        const ctxParts = [];
        if (selectedDay) ctxParts.push(dayName[selectedDay]);
        if (isNow)       ctxParts.push('right now');
        const ctxStr = ctxParts.length ? ' on ' + ctxParts.join(' · ') : '';
        e.innerHTML = `<p style="margin:0 0 6px">No "${escape(query.trim())}"${ctxStr}.</p>`;
        if (allHits.length > 0) {
          // Group by day; for each day, surface a "switch to this day" button.
          const byDay = {};
          allHits.forEach(a => { (byDay[a.day] = byDay[a.day] || []).push(a); });
          const links = document.createElement('div');
          links.className = 'cross-day-links';
          Object.keys(byDay).map(Number).sort().forEach(d => {
            const sample = byDay[d][0];
            const sampleStartMin = timeStrToMins(sample.start);
            const sampleStart = sampleStartMin != null ? formatMins(sampleStartMin) : '';
            const more = byDay[d].length > 1 ? ` +${byDay[d].length - 1}` : '';
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'switch-day-btn';
            btn.innerHTML = `Switch to <b>${dayShort[d]}</b> · <span class="muted">${escape(sample.name)} · ${sampleStart}${more}</span>`;
            btn.onclick = () => {
              selectedDay = d;
              selectedNow = false;          // clear Now so the matching artist isn't filtered out
              renderDayChips();
              renderTimeBuckets();
              renderArtistResults(artistInput.value);
            };
            links.appendChild(btn);
          });
          e.appendChild(links);
        }
        artistResults.appendChild(e);
      } else if (isNow && !nowCtx) {
        // Tailor the empty-state copy to where we are vs the festival window.
        const ts = appNow().getTime();
        const fri5pm = new Date(2026, 4, 15, 17).getTime();
        const mon7am = new Date(2026, 4, 18,  7).getTime();
        if (ts < fri5pm) {
          e.textContent = 'Festival drops Fri May 15 · 5pm.';
        } else if (ts >= mon7am) {
          e.textContent = 'EDC ’26 wrapped. PLUR forever.';
        } else {
          // Daytime gap — show which night is up next AND when its first set fires.
          // Day 1 has 5pm openers; Day 2 & 3 first sets are at 7pm.
          const sat5pm = new Date(2026, 4, 16, 17).getTime();
          const sun5pm = new Date(2026, 4, 17, 17).getTime();
          const next = ts < sat5pm ? { name: 'Saturday', start: '7pm' }
                     : ts < sun5pm ? { name: 'Sunday',   start: '7pm' }
                     : null;
          e.textContent = next
            ? `${next.name} kicks off at ${next.start}.`
            : 'Tonight kicks off soon.';
        }
        artistResults.appendChild(e);
      } else if (isNow && nowCtx) {
        e.textContent = 'Nothing playing right now on this day.';
        artistResults.appendChild(e);
      } else {
        e.textContent = 'No DJs in the lineup yet for this night.';
        artistResults.appendChild(e);
      }
    } else {
      const dayShort = { 1: 'Fri', 2: 'Sat', 3: 'Sun' };
      // For stage-grouped sort, insert a section header before each new stage.
      // Stage filter overrides (one stage already, no need for headers).
      const showStageHeaders = selectedSort === 'stage';
      let lastStage = null;
      filtered.forEach(a => {
        if (showStageHeaders && a.stage !== lastStage) {
          lastStage = a.stage;
          const sObj = stage(a.stage);
          const header = document.createElement('button');
          header.type = 'button';
          header.className = 'lineup-stage-header';
          header.setAttribute('aria-label', `Filter to ${sObj.id}`);
          header.innerHTML = `<span class="lsh-dot" style="background:${sObj.color}"></span><span class="lsh-name" style="color:${sObj.color}">${sObj.id}</span><span class="lsh-tap">tap to filter →</span>`;
          header.onclick = () => {
            artistInput.value = sObj.id;
            syncClearBtn();
            renderArtistResults(sObj.id);
            artistInput.focus();
          };
          artistResults.appendChild(header);
        }
        const s = stage(a.stage);
        const sm = timeStrToMins(a.start);
        const startLabel = sm != null ? formatMins(sm) : '';
        const existingPickId = findPickIdForArtist(a);
        const row = document.createElement('div');
        row.className = 'artist-result';
        // Use sprite if avatar is in the bundled set (100% offline reliable);
        // fall back to direct CloudFront URL if not (e.g. new artist not in
        // the build-time sprite). The sprite is 288×288 cells, downscaled
        // to 36px display via background-size.
        const spriteStyle = avatarSpriteStyleFor(a.image, 36);
        const avatarHTML = spriteStyle
          ? `<span class="avatar" style="${spriteStyle}"></span>`
          : (a.image
              ? `<img class="avatar" src="${escape(a.image)}" loading="lazy" alt="" onerror="this.style.visibility='hidden'" />`
              : `<span class="avatar"></span>`);
        row.innerHTML = `
          ${avatarHTML}
          <a class="name" href="${escape(spotifyUrl(a.name))}" target="_blank" rel="noopener" aria-label="Listen to ${escape(a.name)} on Spotify">${highlight(a.name, query)}</a>
          <span class="stage-tag">
            ${startLabel ? `<span class="time-part">${startLabel}</span><span class="sep">·</span>` : ''}<span class="day-part">${dayShort[a.day] || ''}</span><span class="sep">·</span><span class="stage-part${s.tier === 'secondary' ? ' stage-secondary' : ''}" style="color:${s.color}">${s.id}</span>
          </span>
          <button class="heart ${existingPickId ? 'on' : ''}" aria-label="${existingPickId ? 'Remove from schedule' : 'Add to schedule'}">${existingPickId ? '♥' : '♡'}</button>
        `;
        row.querySelector('.heart').onclick = (e) => { e.stopPropagation(); toggleHeartArtist(a); };
        artistResults.appendChild(row);
      });
    }
    artistResults.classList.add('show');
  }

  document.querySelectorAll('.night-btn').forEach(b => {
    b.onclick = () => { state.night = Number(b.dataset.night); save(); render(); };
  });

  function deletePick(pickId) {
    Object.values(state.picks).forEach(arr => {
      const i = arr.findIndex(x => x.id === pickId);
      if (i >= 0) arr.splice(i, 1);
    });
    save(); render();
  }

  document.querySelectorAll('.tab').forEach(b => {
    if (!b.dataset.tab) return; // skip helpTab and any non-navigation tabs
    b.onclick = () => { state.tab = b.dataset.tab; save(); render(); };
  });

  loadArtists().then(async () => {
    // Re-sync existing picks against the lineup. Two reasons:
    //   1. Backfill missing image URLs (older picks before image was saved)
    //   2. Re-compute startMins/endMins/bucket — these depend on dayStartHour,
    //      and shifting the festival window moves all positions by an offset.
    let migrated = false;
    Object.values(state.picks).forEach(arr => {
      arr.forEach(p => {
        const t = p.artist.toLowerCase();
        const hit = ARTISTS.find(x =>
          x.name.toLowerCase() === t && x.stage === p.stage
        );
        if (!hit) return;
        if (!p.image && hit.image) { p.image = hit.image; migrated = true; }
        const newStart = timeStrToMins(hit.start);
        const newEnd   = timeStrToMins(hit.end);
        if (newStart != null && newEnd != null) {
          if (p.startMins !== newStart) { p.startMins = newStart; migrated = true; }
          if (p.endMins   !== newEnd)   { p.endMins   = newEnd;   migrated = true; }
          const newBucket = bucketFromMinutes(newStart);
          if (p.bucket !== newBucket)   { p.bucket    = newBucket; migrated = true; }
        }
      });
    });
    if (migrated) save();

    // Load the avatar sprite coordinate map BEFORE first render so all
    // avatars use sprite-backed background-image (100% offline reliable).
    await loadAvatarCoords();
    render();

    // Pre-warm all artist images so the lineup is fully offline-ready.
    // Avatars go to IndexedDB (no quota padding, 100% reliable). Festival
    // map goes to Cache API. Set times + schedule PNG were SHELL-cached
    // atomically on SW install.
    setTimeout(prewarmFestivalMap, 800);
    setTimeout(startOfflineStatusPoll, 1200);

    // When the network reconnects (e.g. user moved out of dead zone, or
    // hopped onto Wi-Fi after data ran out), re-trigger the prewarmer.
    // Already-cached images return instantly from cache; missing ones get
    // another fetch attempt. Resilient to mid-flight interruptions.
    window.addEventListener('online', () => {
      setTimeout(prewarmFestivalMap, 500);
      setTimeout(refreshOfflineStatus, 1500);
    });
  });

  // Show a subtle "Offline ready" line above the footer ONLY when:
  //   1. Set times (artists.json) + full schedule PNG are in the SHELL cache
  //      (these are non-negotiable — a missing one means the festival data
  //       itself isn't available offline)
  //   2. ≥90% of DJ avatars + festival map are in the IMAGES cache (the 10%
  //      tolerance handles CDN flakes; missing avatars degrade to placeholders
  //      but never affect set-time data)
  async function refreshOfflineStatus() {
    const el = document.getElementById('offlineStatus');
    if (!el) return null;
    if (!('caches' in window)) return null;

    let shellOk = false, mapOk = false;
    try {
      // SHELL must contain: set times (artists.json), full schedule PNG,
      // avatars sprite (.jpg + .json). All atomic-installed by the SW so
      // either present or missing as a group.
      const shellNames = (await caches.keys()).filter(n => n.startsWith('myraverlife-shell-'));
      for (const name of shellNames) {
        const c = await caches.open(name);
        const urls = (await c.keys()).map(r => r.url);
        const hasSet = urls.some(u => u.endsWith('/assets/artists.json'));
        const hasSched = urls.some(u => u.endsWith('/assets/schedule-all.png'));
        const hasSprite = urls.some(u => u.endsWith('/assets/avatars-sprite.jpg'));
        const hasCoords = urls.some(u => u.endsWith('/assets/avatars-coords.json'));
        if (hasSet && hasSched && hasSprite && hasCoords) { shellOk = true; break; }
      }
      // Festival map cached separately via prewarmer (page-side cache.put)
      const c = await caches.open('myraverlife-images-v1');
      const imgSet = new Set((await c.keys()).map(r => r.url));
      mapOk = typeof FESTIVAL_MAP_URL === 'string' && imgSet.has(FESTIVAL_MAP_URL);
    } catch (e) {}

    // True 100% offline: SHELL atomic install gives us set times + schedule
    // + ALL avatars (via sprite). Festival map is the only individual
    // cross-origin image that needs separate caching.
    const ready = shellOk && mapOk;
    if (ready) {
      el.textContent = '✓ Offline ready';
      el.style.display = '';
    } else {
      el.textContent = '';
      el.style.display = 'none';
    }
    return ready;
  }

  // Poll until ready, then stop.
  function startOfflineStatusPoll() {
    refreshOfflineStatus().then((ready) => {
      if (ready) return;
      const t = setInterval(async () => {
        if (await refreshOfflineStatus()) clearInterval(t);
      }, 1500);
    });
  }

  // Cross-origin festival map URL (only image we still hot-link from
  // CloudFront — avatars are now bundled in assets/avatars-sprite.jpg
  // via APP_SHELL for atomic 100% offline reliability).
  const FESTIVAL_MAP_URL = 'https://d3vhc53cl8e8km.cloudfront.net/hello-staging/wp-content/uploads/sites/21/2025/05/13125821/edclv_2025_de_festival_map_1080x1350_r02_v01.png';

  // Pre-fetch the festival map via Cache API so the Map tab works offline
  // even if the user never opened it while online. The map is the only
  // cross-origin image we still hot-link (DJ avatars are bundled in the
  // sprite for atomic install).
  let _prewarmRunning = false;
  async function prewarmFestivalMap() {
    if (_prewarmRunning) return;
    if (typeof navigator !== 'undefined' && navigator.onLine === false) return;
    if (!('caches' in window)) return;

    _prewarmRunning = true;
    try {
      const cache = await caches.open('myraverlife-images-v1');
      const CHUNK = 1;
      const urls = [FESTIVAL_MAP_URL];
      for (let i = 0; i < urls.length; i += CHUNK) {
        if (navigator.onLine === false) break;
        await Promise.allSettled(urls.slice(i, i + CHUNK).map(async (u) => {
          if (await cache.match(u)) return;
          try {
            const response = await fetch(u, { mode: 'no-cors' });
            await cache.put(u, response);
          } catch (e) { /* quota exhausted or network failure — letter circle covers it */ }
        }));
      }
    } finally {
      _prewarmRunning = false;
    }
  }

  // Service worker for offline support. Aggressive update strategy
  // because iOS Safari otherwise caches sw.js for hours/days. We trigger
  // a check on every reasonable signal:
  //   1. updateViaCache: 'none' — browser never uses HTTP cache for sw.js
  //   2. After registration → immediate update() check
  //   3. On every page load → registration.update()
  //   4. On every visibility-to-visible (user returns to app)
  //   5. On every 'online' event (network reconnects)
  //   6. Auto-reload on controllerchange when new SW takes over
  if ('serviceWorker' in navigator) {
    function checkForUpdate() {
      navigator.serviceWorker.getRegistration()
        .then(reg => reg && reg.update())
        .catch(() => {});
    }
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' })
        .then(() => checkForUpdate())
        .catch(err => console.warn('Service worker registration failed:', err));
    });
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') checkForUpdate();
    });
    window.addEventListener('online', checkForUpdate);
    let _swRefreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (_swRefreshing) return;
      _swRefreshing = true;
      window.location.reload();
    });
  }
</script>
</body>
</html>
